# Test case 152: 窗口选择
# Module: 工作区(#116131)
# Priority: 2

name: "窗口选择"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 横向分屏"
    action: context_menu_comb
    ref: context_horizontal_split
  - action: wait
    duration: 1.0

  - name: "步骤1: 当前焦点在下方分屏，纵向分屏"
    action: context_menu_comb
    ref: context_vertical_split
  - action: wait
    duration: 1.0

  - name: "步骤1: 截图-横向加纵向分屏"
    action: screenshot
    desc: "分屏窗口显示正常"

  - name: "步骤3: 快捷键Alt+Down选择下方窗口"
    action: keyboard_hot_key
    keys: "alt+down"
  - action: wait
    duration: 0.5

  - name: "步骤3: 快捷键Alt+Up选择上方窗口"
    action: keyboard_hot_key
    keys: "alt+up"
  - action: wait
    duration: 0.5

  - name: "步骤3: 快捷键Alt+Right选择右侧窗口"
    action: keyboard_hot_key
    keys: "alt+right"
  - action: wait
    duration: 0.5

  - name: "步骤3: 快捷键Alt+Left选择左侧窗口"
    action: keyboard_hot_key
    keys: "alt+left"
  - action: wait
    duration: 0.5

  - name: "步骤3: 截图-窗口选择切换后"
    action: screenshot
    desc: "工作区窗口能够被选中切换"

  - name: "验证终端仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
