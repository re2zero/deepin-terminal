# Test case 061: 键盘交互右键菜单中调出远程管理插件
# Module: 键盘交互(#116109)
# Priority: 2

name: "键盘交互-右键菜单远程管理"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 按Alt+M调出右键菜单"
    action: context_menu_comb
    ref: context_remote_management
  - action: wait
    duration: 0.5

  - name: "步骤2: 远程管理列表没有获得Focus效果，验证进程运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "Shift+Tab反向切换测试"
    action: keyboard_hot_key
    keys: "shift,Tab"
  - action: wait
    duration: 0.5

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
