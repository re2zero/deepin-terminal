# Test case 052: 键盘交互远程管理功能，焦点在服务器列表不是组上
# Module: 键盘交互(#116109)
# Priority: 2
# Precondition: 列表有2个以上服务器

name: "键盘交互-远程服务器列表(非组)"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 打开远程管理插件"
    action: main_menu_comb
    ref: menu_remote_management
  - action: wait
    duration: 0.3

  - name: "步骤1: Tab键切换到远程管理插件搜索框"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3

  - name: "步骤2: 再按Tab键，焦点在远程服务器列表"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3

  - name: "步骤3: 按↓方向键切换服务器列表"
    action: keyboard_press
    key: "Down"
  - action: wait
    duration: 0.3

  - name: "步骤3: 按↑方向键切换服务器列表"
    action: keyboard_press
    key: "Up"
  - action: wait
    duration: 0.3

  - name: "步骤4: 焦点在不是组的服务器上，按→方向键"
    action: keyboard_press
    key: "Right"
  - action: wait
    duration: 0.3

  - name: "步骤5: 按Enter键进入编辑服务器界面"
    action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.3

  - name: "步骤6: 按↓方向键跳转到下一个服务器"
    action: keyboard_press
    key: "Down"
  - action: wait
    duration: 0.3

  - name: "步骤6: 按↑方向键跳转到上一个服务器"
    action: keyboard_press
    key: "Up"
  - action: wait
    duration: 0.3

  - name: "步骤7: 按Enter键执行连接服务器"
    action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.3

  - name: "Shift+Tab反向切换测试"
    action: keyboard_hot_key
    keys: "shift,Tab"
  - action: wait
    duration: 0.3

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
