name: "列表"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "打开主菜单-自定义命令"
    action: main_menu_comb
    ref: main_menu_button
    menu: ["自定义命令"]
  - action: wait
    duration: 1.0

  - name: "添加第一个自定义命令"
    action: element_set_value
    ref: custom_command_name_input
    value: "test_cmd_1"
  - action: element_set_value
    ref: custom_command_command_input
    value: "echo hello1"
  - action: element_action
    ref: custom_command_add
    do: "click"
  - action: wait
    duration: 1.0

  - name: "添加第二个自定义命令"
    action: element_set_value
    ref: custom_command_name_input
    value: "test_cmd_2"
  - action: element_set_value
    ref: custom_command_command_input
    value: "echo hello2"
  - action: element_action
    ref: custom_command_add
    do: "click"
  - action: wait
    duration: 1.0

  - name: "添加第三个自定义命令"
    action: element_set_value
    ref: custom_command_name_input
    value: "test_cmd_3"
  - action: element_set_value
    ref: custom_command_command_input
    value: "echo hello3"
  - action: element_action
    ref: custom_command_add
    do: "click"
  - action: wait
    duration: 1.0

  - name: "滚动列表查看所有命令"
    action: element_action
    ref: custom_command_list
    do: "click"
  - action: mouse_scroll
    amount: -3
  - action: wait
    duration: 0.5
  - action: mouse_scroll
    amount: 3
  - action: wait
    duration: 0.5

  - name: "验证终端仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
