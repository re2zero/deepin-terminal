# YAML test case for terminal - 标签页右键菜单 (id=116)
# Module: 右键菜单标签页(#116127)
# Priority: 2
name: "标签页右键菜单"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 验证主窗口显示正常"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤2: 右键单击标签栏查看菜单项"
    action: element_action
    ref: tab_list
    do: "right_click"
  - action: wait
    duration: 0.5
  - name: "按ESC关闭菜单"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.5

  - name: "步骤3: 新建多个标签页"
    action: element_action
    ref: add_tab_button
    do: "click"
  - action: wait
    duration: 1.0
  - action: element_action
    ref: add_tab_button
    do: "click"
  - action: wait
    duration: 1.0
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤4: 多标签时右键标签栏查看菜单项"
    action: element_action
    ref: tab_list
    do: "right_click"
  - action: wait
    duration: 0.5
  - name: "按ESC关闭菜单"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.5

  - name: "步骤5: 右键标签栏打开菜单，选择关闭标签页"
    action: element_action
    ref: tab_list
    do: "right_click"
  - action: wait
    duration: 0.5
  - name: "按Return选择关闭标签页"
    action: keyboard_press
    key: "Return"
  - action: wait
    duration: 1.0
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤6: 新建更多标签页用于关闭其它测试"
    action: element_action
    ref: add_tab_button
    do: "click"
  - action: wait
    duration: 1.0
  - name: "右键打开菜单选择关闭其它标签页"
    action: element_action
    ref: tab_list
    do: "right_click"
  - action: wait
    duration: 0.5
  - action: keyboard_press
    key: "Down"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Down"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 1.0
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤7: 验证终端在有程序运行时进程正常"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
