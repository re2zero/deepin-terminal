name: 雷神窗口切换
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 使用快捷键 Alt+F2调出雷神窗口
    2. 再次按Alt+F2
    3. 雷神窗口没有获取焦点时，首次按Alt+F2
    4. 再次按Alt+F2
    5. 雷神窗口在其他工作区显示时，按Alt+F2
    6. 关闭窗口特效，检查步骤5的结果
    7. 雷神窗口在其他工作区隐藏时，按Alt+F2
  预期结果:
    1. 显示雷神窗口且被选中
    2. 雷神窗口被隐藏
    3. 不会隐藏雷神窗口；是聚焦到雷神窗口
    4. 隐藏雷神终端（只有焦点在雷神窗口时，才会隐藏窗口）
    5. 会自动切换到雷神终端所在工作区
    6. 自动切换到雷神终端所在工作区
    7. 把雷神窗口从其他工作区拉到当前工作区并显示
module: 104X
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1652979'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤2: Alt+F2调出雷神窗口'
  action: keyboard_press
  value: Alt,F2
  wait: 2.0
- name: '步骤3: 截图-雷神窗口显示且被选中'
  action: noop
- name: '步骤4: 再次按Alt+F2隐藏雷神窗口'
  action: keyboard_press
  value: Alt,F2
  wait: 1.5
- name: '步骤5: Alt+F2再次显示雷神窗口（仅聚焦）'
  action: keyboard_press
  value: Alt,F2
  wait: 2.0
- name: '步骤6: 截图-雷神窗口再次显示'
  action: noop
- name: '步骤7: 验证终端进程运行中'
  action: wait
  value: '1000'
teardown:
- action: session_stop
