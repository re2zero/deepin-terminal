name: 正常窗口
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 首次打开终端，检查窗口显示
    2. 检查正常窗口显示
    3. 修改窗口大小，关闭窗口，重新打开
  预期结果:
    1. 显示为正常窗口，居中显示
    2. 圆角窗口，显示默认标签栏
    3. 窗口大小被记录，居中显示
module: 104X
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1652989'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 首次打开终端，检查窗口显示（居中显示）'
  action: wait
  value: '1000'
- name: '步骤1: 验证正常窗口居中显示（终端仍在运行）'
  action: wait
  value: '1000'
- name: '步骤2: 检查正常窗口显示（圆角窗口，默认标签栏）'
  action: wait
  duration: 0.3
- name: '步骤2: 验证圆角窗口显示正常（终端仍在运行）'
  action: wait
  value: '1000'
- name: '步骤3: 修改窗口大小（最大化再还原）'
  action: keyboard_press
  value: ctrl+f
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Escape
- action: wait
  duration: 0.3
- name: '步骤3: 验证窗口大小修改后终端仍在运行'
  action: wait
  value: '1000'
teardown:
- action: session_stop
