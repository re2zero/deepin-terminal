name: 关闭窗口
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开多个窗口，点击关闭
    2. 打开2个窗口，然后最小化，点击dock上图标；在预览中点击关闭1个窗口
  预期结果:
    1. 当前窗口被关闭
    2. 窗口被关闭，剩下一个窗口显示正常
module: 主界面右上角菜单栏
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1652953'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 点击关闭按钮（触发退出保护弹框）'
  action: element_action
  ref: close_button
  do: click
  wait: 0.3
- name: 点击取消按钮取消关闭
  action: element_action
  ref: exit_cancel
  do: click
  wait: 0.3
- name: 验证终端仍在运行
  action: wait
  value: '1000'
- name: '步骤2: 通过主菜单新建窗口'
  action: main_menu_comb
  ref: menu_new_window
  wait: 1.5
- name: 在新窗口中点击关闭按钮
  action: element_action
  ref: close_button
  do: click
  wait: 0.3
- name: 在退出保护弹框中点击确定按钮关闭窗口
  action: element_action
  ref: exit_confirm
  do: click
  wait: 2.0
- name: 验证终端进程运行中（原窗口仍在）
  action: wait
  value: '1000'
teardown:
- action: session_stop
