name: 窗口选择
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开终端，右键菜单做横向、纵向分屏操作
    2. 鼠标点击分别选中左面、右面、上面、下面窗口拖动
    3. 快捷键Alt+Up、Alt+Down、Alt+Left、Alt+Right
  预期结果:
    1. 分屏窗口显示正常
    2. 工作区窗口能够被选中
    3. 工作区窗口能够被选中
module: 工作区
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653055'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 横向分屏'
  action: context_menu_comb
  ref: context_horizontal_split
- action: wait
  duration: 0.3
- name: '步骤1: 当前焦点在下方分屏，纵向分屏'
  action: context_menu_comb
  ref: context_vertical_split
- action: wait
  duration: 0.3
- name: '步骤1: 截图-横向加纵向分屏'
  action: noop
- name: '步骤3: 快捷键Alt+Down选择下方窗口'
  action: keyboard_press
  value: alt+down
- action: wait
  duration: 0.3
- name: '步骤3: 快捷键Alt+Up选择上方窗口'
  action: keyboard_press
  value: alt+up
- action: wait
  duration: 0.3
- name: '步骤3: 快捷键Alt+Right选择右侧窗口'
  action: keyboard_press
  value: alt+right
- action: wait
  duration: 0.3
- name: '步骤3: 快捷键Alt+Left选择左侧窗口'
  action: keyboard_press
  value: alt+left
- action: wait
  duration: 0.3
- name: '步骤3: 截图-窗口选择切换后'
  action: noop
- name: 验证终端仍在运行
  action: wait
  value: '1000'
teardown:
- action: session_stop
