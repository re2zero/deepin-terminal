name: 丢失焦点隐藏雷神窗口复选框
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 进入设置，焦点在丢失焦点隐藏雷神窗口复选框
    2. 键盘按Enter键
  （PS：测试时需要测试Shift+Tab反向切换）
  预期结果:
    1. 复选框有Focus效果
    2. 取消/选中复选框
module: 键盘交互
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653555'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 通过主菜单打开设置'
  action: main_menu_comb
  ref: menu_settings
  wait: 0.3
- name: '步骤2: 点击窗口设置导航项'
  action: element_action
  ref: settings_window
  do: click
  wait: 0.3
- name: '步骤3: Tab键将焦点移到丢失焦点隐藏雷神窗口复选框（默认不勾选）'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤4: 再次Tab键确保焦点在目标复选框'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤5: Enter键勾选丢失焦点隐藏雷神窗口'
  action: keyboard_press
  key: Enter
  wait: 0.3
- name: '步骤6: Shift+Tab反向切换焦点'
  action: keyboard_press
  value: Shift,Tab
  wait: 0.3
- name: '步骤7: 再次Enter键取消勾选（恢复默认）'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤8: Tab键确保焦点在复选框'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤9: Enter键取消勾选'
  action: keyboard_press
  key: Enter
  wait: 0.3
- name: '步骤10: ESC关闭设置窗口'
  action: keyboard_press
  key: Escape
  wait: 0.3
- name: 验证终端进程运行中
  action: wait
  value: '1000'
teardown:
- action: session_stop
