# UNSUPPORTED: 触摸操作无法自动化
name: '普通窗口Ctrl+S和Ctrl+Q流控制 - NON-AUTOMATABLE: 触摸操作无法自动化'
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开终端，进入设置，高级设置
    2. 点击shell分类选项
    3. 勾选“禁用Ctrl+S和Ctrl+Q流控制”，在终端中使用快键“Ctrl+S”
    4. 不勾选“禁用Ctrl+S和Ctrl+Q流控制”，在终端中使用“Ctrl+S”
    5. 在终端中输入任意命令
    6. 点击文案提示框的“ｘ”按钮
    7. 键盘按下“Ctrl+Q”
  Notes:测试时一并测试触摸屏、触控板、键盘交互
  预期结果:
    1. 有shell分类选项
    2. shell分类下有“禁用Ctrl+S和Ctrl+Q流控制”选项；checkbox复选框默认不勾选；界面显示与UI设计一致
    3. 无反应，可以正常输入命令
    4. 弹出提示文案“已经按下Ctrl+S，输出被挂起。可以按下Ctrl+Q继续。”
    5. 终端中的输入被挂起，输入的命令无法显示在终端中
    6. 文案提示框被关闭
    7. 输入恢复，之前被禁用数据被恢复
module: 设置界面高级设置
feature: ''
tags:
- L1
vars:
  XLSX_ID: '1653301'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: 跳过 - skip-触摸操作无法自动化
  action: wait
  value: '300'
- name: 验证终端进程运行中
  action: wait
  value: '1000'
teardown:
- action: session_stop
