# YAML test case for terminal - 自动换行显示 (id=198)
# Module: 自动换行(#116165)
# Priority: 2
name: "终端界面内容自动换行显示"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 输入较长命令"
    action: keyboard_type_text
    text: "echo 'This is a very long test string to verify auto wrap behavior in terminal window display area'"
  - action: wait
    duration: 0.5
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 1.0
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤2: 点击最大化按钮"
    action: element_action
    ref: maximize_button
    do: "click"
  - action: wait
    duration: 1.0
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤3: 再次点击恢复窗口大小"
    action: element_action
    ref: maximize_button
    do: "click"
  - action: wait
    duration: 1.0

  - name: "步骤3: 验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
