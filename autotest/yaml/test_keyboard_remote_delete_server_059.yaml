# Test case 059: 键盘交互删除服务器
# Module: 键盘交互(#116109)
# Priority: 2

name: "键盘交互-删除服务器"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 打开远程管理插件，选中服务器进入编辑界面"
    action: main_menu_comb
    ref: menu_remote_management
  - action: wait
    duration: 0.3

  - name: "Tab键切换到服务器列表"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3

  - name: "按→到编辑按钮，按Enter进入编辑"
    action: keyboard_press
    key: "Right"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.3

  - name: "Tab键切换到删除服务器按钮"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3

  - name: "步骤1: 按Enter/空格键进入删除弹框"
    action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.3

  - name: "步骤2: 按Tab键焦点切换到取消按钮"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3

  - name: "步骤2: 按Tab键焦点切换到确定按钮"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3

  - name: "步骤3: 按空格键取消删除"
    action: keyboard_press
    key: "Space"
  - action: wait
    duration: 0.3

  - name: "步骤4: 按ESC键焦点返回到当前选择删除的服务器"
    action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.3

  - name: "Shift+Tab反向切换测试"
    action: keyboard_hot_key
    keys: "shift,Tab"
  - action: wait
    duration: 0.3

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
