# Test case 059: 键盘交互删除服务器
# Module: 键盘交互(#116109)
# Priority: 2

name: "键盘交互-删除服务器"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 打开远程管理插件"
    action: context_menu_comb
    ref: context_remote_management
  - action: wait
    duration: 0.5

  - name: "步骤2: 点击添加服务器按钮"
    action: element_action
    ref: add_server_button
  - action: wait
    duration: 0.5

  - name: "步骤3: 输入服务器名称"
    action: keyboard_type_text
    text: "测试服务器"
  - action: wait
    duration: 0.3

  - name: "步骤4: 点击添加按钮保存"
    action: element_action
    ref: remote_add
  - action: wait
    duration: 0.5

  - name: "步骤5: 点击已添加的服务器"
    action: element_action
    selector:
      role: "list item"
      index: 0
  - action: wait
    duration: 0.3

  - name: "步骤6: 按Right到编辑按钮，按Return进入编辑"
    action: keyboard_press
    key: "Right"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.5

  - name: "步骤7: 点击删除服务器按钮"
    action: element_action
    ref: remote_delete
  - action: wait
    duration: 0.3

  - name: "步骤8: 点击确定按钮确认删除"
    action: element_action
    selector:
      name: "删 除"
      role: "button"
  - action: wait
    duration: 0.5

  - name: "步骤9: 按Escape关闭远程管理面板"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "步骤10: 验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
