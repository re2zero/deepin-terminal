# UNSUPPORTED: skip-触摸操作无法自动化
name: '设置自定义主题后新建窗口标签页分屏 - NON-AUTOMATABLE: skip-触摸操作无法自动化'
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开终端，进入自定义对话框，分别点击前景色、背景色、提示符PS1、提示符PS2取色控件
    2. 分别在取色板中选择任意颜色，点击“确定”按钮
    3. 点击自定义主题界面“确定” 按钮
    4. 点击标签栏“+”按钮新建一个标签页
    5. 右上角主菜单点击新建窗口
    6. 在新的窗口中右键菜单做横向分屏纵向分屏操作
  Notes:测试时一并测试触摸屏、触控板、键盘交互
  预期结果:
    1. 弹出取色板
    2. 取色板页面关闭，返回到自定义主题弹出框界面；预览效果前景色、背景色、提示符PS1、提示符PS2颜色显示与选择的一致
    3. 保存自定义主题的更改设置；自定义主题弹出框关闭，自定义主题被激活
    4. 新的标签页中前景色、背景色、提示符PS1、提示符PS2显示与自定义中设置的一致
    5. 新打开的窗口中前景色、背景色、提示符PS1、提示符PS2显示与自定义中设置的一致
    6. 分屏的窗口中前景色、背景色、提示符PS1、提示符PS2显示与自定义中设置的一致
module: 主题/自定义主题
