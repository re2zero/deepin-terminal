# Test case 176: 关于1
# Module: /V25_2500（测试部专用）/B类解耦商店应用/终端/104X/主界面右上角菜单栏(#116141)
# Priority: 2

name: "关于1"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 验证主窗口可见"
    action: element_action
    ref: main_frame
    do: "click"
    assert:
      - type: element_visible
        selector:
          role: "frame"

  - name: "步骤2: 通过主菜单打开关于"
    action: main_menu_comb
    ref: menu_about
    wait: 1.0
    assert:
      - type: element_visible
        ref: about_dialog

  - name: "步骤3: 截图-关于界面弹出"
    action: screenshot
    desc: "关于界面弹出，显示版本和版权信息"

  - name: "步骤4: 关闭关于窗口"
    action: keyboard_press
    key: "Escape"
    wait: 1.0

  - name: "步骤5: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
