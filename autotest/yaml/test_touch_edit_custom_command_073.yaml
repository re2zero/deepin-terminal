# NON-AUTOMATABLE: skip-触摸操作无法自动化
name: "触摸屏编辑自定义命令功能 - NON-AUTOMATABLE: 触摸操作无法自动化"
app: "deepin-terminal"
setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0
steps:
  - name: "跳过 - skip-触摸操作无法自动化"
    action: wait
    wait: 0.3
  - name: "验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
