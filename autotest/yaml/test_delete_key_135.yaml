# Test case 135: 删除键
# Module: 远程管理器(#116129)
# Priority: 2
# Steps:
#   1. 在添加服务器对话框中选中删除键选择对话框，查看软件显示
#   2. 在下拉菜单中依次选中选项，查看软件显示
# Expected:
#   1. 软件会自动弹出下拉菜单，并显示出所有的菜单选项
#   2. 菜单选项可以正常被选中

name: "删除键"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:

  - name: "步骤1: 主菜单打开远程管理"
    action: main_menu_comb
    ref: menu_remote_management
    wait: 0.3

  - name: "步骤1: 点击添加服务器按钮"
    action: element_action
    ref: add_server_button
    do: "click"
    wait: 0.3

  - name: "步骤1: 在服务器名输入框中按删除键"
    action: element_action
    ref: remote_server_name
    do: "click"
    wait: 0.3
  - action: keyboard_type
    text: "TestDeleteKey"
    wait: 0.3

  - name: "步骤1: 按删除键清除输入字符"
    action: keyboard_press
    key: "Delete"
    wait: 0.3
  - action: keyboard_press
    key: "Delete"
    wait: 0.3
  - action: keyboard_press
    key: "Delete"
    wait: 0.3

  - name: "步骤2: 在端口输入框中测试删除键下拉"
    action: element_action
    ref: remote_server_port
    do: "click"
    wait: 0.3

  - name: "步骤2: 测试删除键能否弹出下拉菜单"
    action: keyboard_press
    key: "Delete"
    wait: 0.3

  - name: "步骤2: 按↓键选择下拉菜单选项"
    action: keyboard_press
    key: "Down"
    wait: 0.3
  - action: keyboard_press
    key: "Down"
    wait: 0.3
  - action: keyboard_press
    key: "Down"
    wait: 0.3
  - action: keyboard_press
    key: "Return"
    wait: 0.3

  - name: "关闭添加服务器弹框"
    action: keyboard_press
    key: "Escape"
    wait: 0.3

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
