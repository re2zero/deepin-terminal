# YAML test case — 键盘交互添加命令 (id=047)
# 验证添加自定义命令对话框中的Tab键导航和ESC退出
name: "键盘交互添加命令"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "打开自定义命令插件"
    action: main_menu_comb
    ref: main_menu_button
    menu:
      - "自定义命令"
    assert:
      - type: element_visible
        selector:
          role: "list"

  - name: "Tab键切换到添加命令按钮区域"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "继续Tab到添加命令按钮"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "再Tab一次到达添加命令按钮"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "按Enter打开添加命令弹框"
    action: keyboard_press
    key: "Return"
    wait: 0.5

  - name: "验证添加命令弹框打开"
    action: wait
    assert:
      - type: element_visible
        selector:
          role: "text"

  - name: "按Tab键切换到命令输入框"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "再Tab切换到快捷键输入框"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "再Tab切换到取消按钮"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "再Tab切换到添加按钮"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "按Shift+Tab反向切换"
    action: keyboard_hot_key
    keys: "Shift,Tab"
    wait: 0.3

  - name: "按ESC退出添加命令弹框"
    action: keyboard_press
    key: "Escape"
    wait: 0.3

  - name: "验证焦点返回自定义命令列表"
    action: wait
    assert:
      - type: element_visible
        selector:
          role: "list"

teardown:
  - action: session_stop
