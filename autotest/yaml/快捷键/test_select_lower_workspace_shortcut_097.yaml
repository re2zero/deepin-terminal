name: 选择下面的工作区快捷键
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开设置界面，检查选择下面的工作区默认快捷键显示
    2. 使用默认快捷键
    3. 修改快捷键为其他，如 ctrl+j使用新的快捷键
    4. 使用旧的快捷键
    5. 检查配置文件cat ~/.config/deepin/deepin-terminal/config.conf
  预期结果:
    1. 默认：alt+down
    2. 选择下面的工作区
    3. 新的快捷键生效
    4. 旧的快捷键不生效
    5. select_lower_workspace和设置界面显示一致
module: 设置界面快捷键
feature: ''
tags:
- L3
vars:
  XLSX_ID: '1653253'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 新建一个工作区'
  action: element_action
  ref: add_tab_button
  do: click
- action: wait
  duration: 0.3
- name: '步骤2: 打开设置界面'
  action: main_menu_comb
  ref: menu_settings
- name: '步骤3: 点击快捷键导航'
  action: element_action
  ref: settings_shortcuts
  do: click
- action: wait
  duration: 0.3
- name: '步骤4: 点击其他子类别'
  action: element_action
  ref: settings_other_shortcuts
  do: click
- action: wait
  duration: 0.3
- name: '步骤5: Tab切换到选择下面工作区快捷键项'
  action: keyboard_press
  key: Tab
- action: keyboard_press
  key: Tab
- action: keyboard_press
  key: Tab
- action: keyboard_press
  key: Tab
- name: '步骤6: Enter进入编辑模式，修改快捷键为Ctrl+J'
  action: keyboard_press
  key: Return
- action: wait
  duration: 0.3
- action: keyboard_press
  value: ctrl+j
- action: wait
  duration: 0.3
- name: '步骤7: 使用旧快捷键验证不生效'
  action: keyboard_press
  value: alt+down
- action: wait
  duration: 0.3
- name: '步骤8: 验证设置对话框可见'
  action: wait
  assert:
  - type: element_visible
  selector: null
  role: dialog
- name: '步骤9: 验证终端进程运行中'
  action: wait
  value: '1000'
teardown:
- action: session_stop
