name: 粘贴快捷键
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 点击添加自定义命令
    2. 分别点击取消 、右上角x;
    3. 鼠标点击快捷键栏输入栏，键盘只敲字母或者数字符号
    4. 鼠标点击快捷键输入栏，键盘敲入ctrl/alt/shift+字母/符号
    5. 鼠标点击快捷键输入栏，键盘敲入ctrl+shift/alt+字母/符号
    6. 鼠标点击快捷键输入栏，键盘敲入ctrl+tab+字母/符号
    7. 鼠标点击快捷键输入栏，键盘敲入ctrl+shift/alt+双字符
    8. 鼠标点击快捷键输入栏，键盘敲入ctrl/shift/alt+字母/数字
  预期结果:
    1. 弹出添加自定义窗口
    2. 退出添加窗口，回到添加自定义栏
    3. 不能正常敲入
    4. 可以正常敲入且显示正常
    5. 可以再次敲入且显示正常
    6. 提示“快捷键Ctrl+Tab已被占用，请重新设置”
    7. 只能敲入单字符
    8. 可以正常敲入
module: 自定义命令
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653021'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 打开设置界面'
  action: main_menu_comb
  ref: menu_settings
- name: '步骤2: 点击快捷键导航'
  action: element_action
  ref: settings_shortcuts
  do: click
- action: wait
  duration: 0.3
- name: '步骤3: 点击终端子类别'
  action: element_action
  ref: settings_terminal_shortcuts
  do: click
- action: wait
  duration: 0.3
- name: '步骤4: 使用默认粘贴快捷键Ctrl+Shift+V'
  action: keyboard_press
  value: ctrl+shift+v
- action: wait
  duration: 0.3
- name: '步骤5: Tab切换到粘贴快捷键项'
  action: keyboard_press
  key: Tab
- action: keyboard_press
  key: Tab
- name: '步骤6: Enter进入编辑模式，修改快捷键为Ctrl+E'
  action: keyboard_press
  key: Return
- action: wait
  duration: 0.3
- action: keyboard_press
  value: ctrl+e
- action: wait
  duration: 0.3
- name: '步骤7: 使用旧快捷键验证不生效'
  action: keyboard_press
  value: ctrl+shift+v
- action: wait
  duration: 0.3
- name: '步骤8: 验证设置对话框可见'
  action: wait
  assert:
  - type: element_visible
  selector: null
  role: dialog
- name: '步骤9: 验证终端进程运行中'
  action: wait
  value: '1000'
teardown:
- action: session_stop
