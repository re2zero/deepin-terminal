# Test case 091: 选中文字时自动复制到剪贴板选项勾选与不勾选功能
# Module: 设置界面高级设置(#116119)
# Priority: 2

name: "选中文字时自动复制到剪贴板"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 打开设置界面"
    action: main_menu_comb
    ref: menu_settings

  - name: "步骤2: 点击高级设置导航"
    action: element_action
    ref: settings_advanced
    do: "click"
  - action: wait
    duration: 0.3

  - name: "步骤3: Tab导航至光标闪烁区域"
    action: keyboard_press
    key: "Tab"
  - action: keyboard_press
    key: "Tab"
  - action: keyboard_press
    key: "Tab"

  - name: "步骤4: 空格键切换自动复制复选框"
    action: keyboard_press
    key: "Space"
  - action: wait
    duration: 0.3

  - name: "步骤5: 验证设置对话框可见"
    action: wait
    assert:
      - type: element_visible
        selector:
          role: "dialog"

  - name: "步骤6: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
