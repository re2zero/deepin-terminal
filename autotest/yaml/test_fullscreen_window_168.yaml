name: "全屏窗口"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "按F11进入全屏"
    action: keyboard_press
    key: "F11"
  - action: wait
    duration: 0.3

  - name: "验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "按F11退出全屏"
    action: keyboard_press
    key: "F11"
  - action: wait
    duration: 0.3

  - name: "验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
