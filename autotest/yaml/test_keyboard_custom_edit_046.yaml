# YAML test case — 键盘交互编辑自定义命令 (id=046)
# 验证编辑自定义命令对话框中的Tab键导航和ESC退出
name: "键盘交互编辑自定义命令"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "打开自定义命令插件"
    action: main_menu_comb
    ref: main_menu_button
    menu:
      - "自定义命令"
    assert:
      - type: element_visible
        selector:
          role: "list"

  - name: "Tab切换到自定义命令列表"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "按右方向键聚焦编辑按钮"
    action: keyboard_press
    key: "Right"
    wait: 0.3

  - name: "按Enter打开编辑对话框"
    action: keyboard_press
    key: "Return"
    wait: 0.5

  - name: "验证编辑对话框打开（名称输入框可见）"
    action: wait
    assert:
      - type: element_visible
        selector:
          role: "text"

  - name: "按Tab键切换到命令输入框"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "再Tab切换到快捷键输入框"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "再Tab切换到删除命令按钮"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "再Tab切换到取消按钮"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "再Tab切换到保存按钮"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "按Shift+Tab反向切换"
    action: keyboard_hot_key
    keys: "Shift,Tab"
    wait: 0.3

  - name: "按ESC退出编辑对话框"
    action: keyboard_press
    key: "Escape"
    wait: 0.3

  - name: "验证返回自定义命令列表"
    action: wait
    assert:
      - type: element_visible
        selector:
          role: "list"

teardown:
  - action: session_stop
