name: "切换工作区"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "新建两个工作区"
    action: element_action
    ref: add_tab_button
    do: "click"
  - action: wait
    duration: 1.0
  - action: element_action
    ref: add_tab_button
    do: "click"
  - action: wait
    duration: 1.0
    assert:
      - type: process_running
        app: "terminal"

  - name: "Ctrl+Tab切换到下一个工作区"
    action: keyboard_hot_key
    keys: "ctrl+tab"
  - action: wait
    duration: 0.5

  - name: "Ctrl+Shift+Tab切换到上一个工作区"
    action: keyboard_hot_key
    keys: "ctrl+shift+tab"
  - action: wait
    duration: 0.5

  - name: "Ctrl+Shift+1切换到第一个工作区"
    action: keyboard_hot_key
    keys: "ctrl+shift+1"
  - action: wait
    duration: 0.5

  - name: "Ctrl+Shift+3切换到第三个工作区"
    action: keyboard_hot_key
    keys: "ctrl+shift+3"
  - action: wait
    duration: 0.5

  - name: "验证终端仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
