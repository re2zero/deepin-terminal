name: "查找显示"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "右键菜单选择查找"
    action: context_menu_comb
    ref: context_search
    wait: 0.3

  - name: "截图-查找界面显示"
    action: screenshot
    desc: "查找界面右上角显示查找框和按钮"

  - name: "按ESC隐藏查找框"
    action: keyboard_press
    key: "Escape"
    wait: 0.3

  - name: "使用快捷键Ctrl+Alt+F调出查找"
    action: keyboard_hot_key
    keys: "ctrl+alt+f"
    wait: 0.3

  - name: "截图-快捷键调出查找"
    action: screenshot
    desc: "快捷键Ctrl+Alt+F调出查找界面"

  - name: "关闭查找框"
    action: keyboard_press
    key: "Escape"
    wait: 0.3

  - name: "横向分屏"
    action: context_menu_comb
    ref: context_horizontal_split
    wait: 0.3

  - name: "在分屏状态下使用快捷键调出查找"
    action: keyboard_hot_key
    keys: "ctrl+alt+f"
    wait: 0.3

  - name: "截图-分屏时查找显示"
    action: screenshot
    desc: "多分屏时查找始终显示在右上角"

  - name: "验证进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
