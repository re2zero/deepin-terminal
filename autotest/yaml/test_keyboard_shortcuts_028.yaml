# Test case 028: 键盘交互焦点在快捷键
# Module: 键盘交互(#116109)
# Priority: 2

name: "键盘交互-快捷键设置"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 打开设置界面"
    action: main_menu_comb
    ref: menu_settings

  - name: "步骤2: Tab键切换到快捷键区域"
    action: keyboard_press
    key: "Tab"
  - action: keyboard_press
    key: "Tab"
  - action: keyboard_press
    key: "Tab"

  - name: "步骤3: 按Enter键进入快捷键编辑模式"
    action: keyboard_press
    key: "Return"

  - name: "步骤4: 输入新的快捷键组合"
    action: keyboard_hot_key
    keys: "ctrl,shift,T"

  - name: "步骤5: 验证设置对话框仍可见"
    action: wait
    assert:
      - type: element_visible
        selector:
          role: "dialog"

  - name: "步骤6: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
