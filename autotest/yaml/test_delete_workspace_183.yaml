# YAML test case for terminal - 删除工作区 (id=183)
# Module: 主界面工作区显示(#116143)
# Priority: 2
name: "删除工作区"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 新建多个工作区"
    action: element_action
    ref: add_tab_button
    do: "click"
  - action: wait
    duration: 1.0
  - action: element_action
    ref: add_tab_button
    do: "click"
  - action: wait
    duration: 1.0

  - name: "步骤2: 使用快捷键Ctrl+Shift+W删除当前工作区"
    action: keyboard_hot_key
    keys: "ctrl,shift,w"
  - action: wait
    duration: 1.0
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤3: 右键关闭工作区（关闭最后一个工作区则退出）"
    action: context_menu_comb
    ref: context_close_workspace
  - action: wait
    duration: 1.0

  - name: "步骤3: 点击确定按钮退出"
    action: element_action
    ref: exit_confirm
    do: "click"
  - action: wait
    duration: 2.0

  - name: "步骤3: 验证终端已退出"
    action: wait
    assert:
      - type: process_not_running
        app: "terminal"

teardown:
  - action: session_stop
