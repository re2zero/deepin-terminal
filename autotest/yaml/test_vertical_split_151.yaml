# Test case 151: [013]窗口纵向分屏
# Module: 工作区(#116131)
# Priority: 1

name: "[013]窗口纵向分屏"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 右键菜单选择纵向分屏"
    action: context_menu_comb
    ref: context_vertical_split
  - action: wait
    duration: 1.0

  - name: "步骤1: 截图-纵向分屏显示"
    action: screenshot
    desc: "工作区窗口纵向分屏显示"

  - name: "步骤1: 验证终端仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤2: 右键菜单关闭窗口恢复单屏"
    action: context_menu_comb
    ref: context_close_workspace
  - action: wait
    duration: 1.0

  - name: "步骤2: 使用快捷键Ctrl+Shift+J纵向分屏"
    action: keyboard_hot_key
    keys: "ctrl+shift+j"
  - action: wait
    duration: 1.0

  - name: "步骤2: 截图-快捷键纵向分屏显示"
    action: screenshot
    desc: "快捷键Ctrl+Shift+J纵向分屏显示"

  - name: "步骤2: 验证终端仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
