# Test case 174: [010]切换主题
# Module: /V25_2500（测试部专用）/B类解耦商店应用/终端/104X/主界面右上角菜单栏(#116141)
# Priority: 1

name: "[010]切换主题"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:

  - name: "步骤2: 切换到深色主题"
    action: main_menu_comb
    ref: main_menu_button
    menu: ["主题", "深色"]
    wait: 0.3

  - name: "步骤3: 截图-深色主题"
    action: screenshot
    desc: "终端显示深色主题"

  - name: "步骤4: 切换到浅色主题"
    action: main_menu_comb
    ref: main_menu_button
    menu: ["主题", "浅色"]
    wait: 0.3

  - name: "步骤5: 截图-浅色主题"
    action: screenshot
    desc: "终端显示浅色主题"

  - name: "步骤6: 切换到跟随系统主题"
    action: main_menu_comb
    ref: main_menu_button
    menu: ["主题", "跟随系统"]
    wait: 0.3

  - name: "步骤7: 截图-跟随系统主题"
    action: screenshot
    desc: "终端显示跟随系统主题"

  - name: "步骤8: 切换回深色主题（恢复默认）"
    action: main_menu_comb
    ref: main_menu_button
    menu: ["主题", "深色"]
    wait: 0.3

  - name: "步骤9: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
