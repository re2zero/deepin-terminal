# Test case 058: 键盘交互编辑远程服务器
# Module: 键盘交互(#116109)
# Priority: 2

name: "键盘交互-编辑远程服务器"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 打开远程管理插件"
    action: context_menu_comb
    ref: context_remote_management
  - action: wait
    duration: 0.5

  - name: "点击添加服务器按钮"
    action: element_action
    ref: add_server_button
  - action: wait
    duration: 0.5

  - name: "步骤2: 填写服务器信息"
    action: keyboard_type_text
    text: "测试服务器"
  - action: wait
    duration: 0.3

  - name: "点击添加按钮保存"
    action: element_action
    ref: remote_add
  - action: wait
    duration: 0.5

  - name: "步骤3: 选中刚添加的服务器"
    action: element_action
    selector:
      role: "list item"
      index: 0
  - action: wait
    duration: 0.3

  - name: "按Right和Return进入编辑模式"
    action: keyboard_press
    key: "Right"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.5

  - name: "步骤4: 编辑服务器名称"
    action: keyboard_hot_key
    keys: "ctrl,a"
  - action: wait
    duration: 0.3
  - action: keyboard_type_text
    text: "编辑后的服务器"
  - action: wait
    duration: 0.3

  - name: "点击保存按钮"
    action: element_action
    ref: remote_save
  - action: wait
    duration: 0.5

  - name: "按ESC键退出远程管理"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
