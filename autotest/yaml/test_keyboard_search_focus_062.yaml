# Test case 062: 键盘交互查找框
# Module: 键盘交互(#116109)
# Priority: 2
# Steps: Ctrl+Alt+F open search, Tab navigate, Shift+Tab reverse, ESC hide

name: "键盘交互-查找框焦点切换"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: Ctrl+Alt+F打开查找框"
    action: keyboard_hot_key
    keys: "ctrl+alt+f"
    wait: 1.0
    assert:
      - type: element_visible
        ref: search_input

  - name: "步骤2: Tab键焦点切换到搜索方向按钮"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "步骤3: 再次Tab键焦点切换到下一个按钮"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "步骤4: Shift+Tab反向切换焦点"
    action: keyboard_hot_key
    keys: "Shift,Tab"
    wait: 0.3

  - name: "步骤5: 再次Shift+Tab反向切换焦点到输入框"
    action: keyboard_hot_key
    keys: "Shift,Tab"
    wait: 0.3

  - name: "步骤6: ESC键隐藏查找框"
    action: keyboard_press
    key: "Escape"
    wait: 0.5
    assert:
      - type: element_not_visible
        ref: search_input

  - name: "验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
