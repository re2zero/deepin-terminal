# Test case 173: [019]设置
# Module: /V25_2500（测试部专用）/B类解耦商店应用/终端/104X/主界面右上角菜单栏(#116141)
# Priority: 2

name: "[019]设置"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 通过主菜单打开设置"
    action: main_menu_comb
    ref: menu_settings
    wait: 0.3

  - name: "步骤2: 截图-设置界面弹出"
    action: screenshot
    desc: "设置界面弹出"

  - name: "步骤3: 按ESC关闭设置窗口"
    action: keyboard_press
    key: "Escape"
    wait: 0.3

  - name: "步骤4: 通过主菜单再次打开设置"
    action: main_menu_comb
    ref: menu_settings
    wait: 0.3

  - name: "步骤5: 按ESC关闭设置窗口"
    action: keyboard_press
    key: "Escape"
    wait: 0.3

  - name: "步骤6: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
