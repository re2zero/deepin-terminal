# YAML test case for terminal - 查找输入框
name: "查找输入框"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:

  - name: "打开搜索框"
    action: keyboard_hot_key
    keys: "ctrl+alt+f"
    wait: 0.3

  - name: "验证搜索输入框显示且焦点聚焦"
    action: element_action
    ref: search_input
    do: "click"
    assert:
      - type: element_visible
        selector:
          name: "DLineEditChildLineEdit"
          role: "text"

  - name: "截图-搜索输入框初始状态"
    action: screenshot
    desc: "搜索框打开，焦点在输入框"

  - name: "输入任意字符包含中英文和特殊符号"
    action: element_set_value
    ref: search_input
    value: "123ASsdh周圣》?:%$%^&"
    wait: 0.3

  - name: "截图-输入特殊字符"
    action: screenshot
    desc: "输入框中正常显示中英文和特殊字符"

  - name: "清除输入后输入长字符串"
    action: element_action
    ref: search_clear_button
    do: "click"
    wait: 0.3

  - name: "输入长字符"
    action: element_set_value
    ref: search_input
    value: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"
    wait: 0.3

  - name: "截图-输入长字符"
    action: screenshot
    desc: "输入框中正常显示长字符串，无长度校验"

  - name: "验证清除按钮可见"
    action: element_action
    ref: search_clear_button
    do: "click"
    assert:
      - type: element_visible
        selector:
          name: "清除"
          role: "button"

  - name: "点击清除按钮清空输入"
    action: element_action
    ref: search_clear_button
    do: "click"
    wait: 0.3

  - name: "截图-清除后状态"
    action: screenshot
    desc: "输入内容被清空，可以重新输入"

  - name: "验证进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
