# YAML test case for terminal - 查找隐藏
name: "查找隐藏"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "验证主窗口可见"
    action: element_action
    ref: main_frame
    do: "click"
    assert:
      - type: element_visible
        selector:
          role: "frame"

  - name: "打开搜索框"
    action: keyboard_hot_key
    keys: "ctrl+alt+f"
    wait: 1.0

  - name: "验证搜索框显示"
    action: element_action
    ref: search_input
    do: "click"
    assert:
      - type: element_visible
        selector:
          name: "DLineEditChildLineEdit"
          role: "text"

  - name: "截图-搜索框打开"
    action: screenshot
    desc: "搜索框已打开"

  - name: "按ESC键隐藏搜索框"
    action: keyboard_press
    key: "Escape"
    wait: 0.5

  - name: "截图-ESC后搜索框隐藏"
    action: screenshot
    desc: "搜索界面被ESC隐藏"

  - name: "再次打开搜索框"
    action: keyboard_hot_key
    keys: "ctrl+alt+f"
    wait: 1.0

  - name: "验证搜索框再次显示"
    action: element_action
    ref: search_input
    do: "click"
    assert:
      - type: element_visible
        selector:
          name: "DLineEditChildLineEdit"
          role: "text"

  - name: "截图-搜索框再次打开"
    action: screenshot
    desc: "搜索框再次打开"

  - name: "点击终端内容区域使搜索框失去焦点"
    action: element_action
    ref: terminal_content
    do: "click"
    wait: 0.5

  - name: "截图-点击终端其他位置后"
    action: screenshot
    desc: "搜索界面因点击终端其他地方而被隐藏"

  - name: "验证进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
