# 键盘交互：编码插件打开状态
# Keyboard interaction: encoding plugin open state
# Alt+M context menu → encoding, Super+Tab, Tab/arrow/Enter/ESC navigation

name: "键盘交互-编码插件打开状态"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "Alt+M调出右键菜单选择编码"
    action: keyboard_hot_key
    keys: "Alt,M"
    wait: 0.5

  - name: "通过右键菜单打开编码"
    action: context_menu_comb
    ref: context_encoding
    wait: 1.0

  - name: "验证编码列表显示"
    action: wait
    assert:
      - type: element_visible
        ref: encoding_list

  - name: "Super+Tab切换焦点"
    action: keyboard_hot_key
    keys: "Super,Tab"
    wait: 0.5

  - name: "Tab键将焦点切换到终端"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "向下箭头选择编码"
    action: keyboard_press
    key: "Down"
    wait: 0.3

  - name: "向上箭头选择编码"
    action: keyboard_press
    key: "Up"
    wait: 0.3

  - name: "Enter键选择当前编码"
    action: keyboard_press
    key: "Enter"
    wait: 0.5

  - name: "再次Alt+M打开编码列表"
    action: keyboard_hot_key
    keys: "Alt,M"
    wait: 0.5

  - name: "再次打开编码菜单"
    action: context_menu_comb
    ref: context_encoding
    wait: 1.0

  - name: "Tab键跳转到主窗口"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "ESC键隐藏编码列表"
    action: keyboard_press
    key: "Escape"
    wait: 0.5

  - name: "验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
