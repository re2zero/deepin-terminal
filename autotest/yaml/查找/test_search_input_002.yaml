name: 查找输入框
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开搜索时，检查光标焦点
    2. 输入任意字符：123ASsdh周圣》?:%$%^&
    3. 输入很长的字符
    4. 输入内容后
    5. 点击x
  预期结果:
    1. 焦点聚焦在输入框
    2. 可以正常输入，无字符校验
    3. 可以正常输入，没有长度校验
    4. 会有清空按钮显示
    5. 输入内容被清空；可以重新输入
module: 查找
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653623'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: 打开搜索框
  action: keyboard_press
  value: ctrl+alt+f
  wait: 0.3
- name: DLineEditChildLineEdit
  action: element_action
  ref: search_input
  do: click
  assert:
  - type: element_visible
  selector: null
  role: text
- name: 截图-搜索输入框初始状态
  action: noop
- name: 输入任意字符包含中英文和特殊符号
  action: element_set_value
  ref: search_input
  value: 123ASsdh周圣》?:%$%^&
  wait: 0.3
- name: 截图-输入特殊字符
  action: noop
- name: 清除输入后输入长字符串
  action: element_action
  ref: search_clear_button
  do: click
  wait: 0.3
- name: 输入长字符
  action: element_set_value
  ref: search_input
  value: abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789
  wait: 0.3
- name: 截图-输入长字符
  action: noop
- name: 清除
  action: element_action
  ref: search_clear_button
  do: click
  assert:
  - type: element_visible
  selector: null
  role: button
- name: 点击清除按钮清空输入
  action: element_action
  ref: search_clear_button
  do: click
  wait: 0.3
- name: 截图-清除后状态
  action: noop
- name: 验证进程运行中
  action: wait
  value: '1000'
teardown:
- action: session_stop
