# NON-AUTOMATABLE: skip-重启类场景需要letmego支持
name: "粘贴 - NON-AUTOMATABLE: 需要letmego支持重启"
app: "deepin-terminal"
setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0
steps:
  - name: "跳过 - skip-重启类场景需要letmego支持"
    action: wait
    wait: 0.3
  - name: "验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
