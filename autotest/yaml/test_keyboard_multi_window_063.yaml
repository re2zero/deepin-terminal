# Test case 063: 键盘交互多窗口中操作
# Module: 键盘交互(#116109)
# Priority: 2
# Steps: Ctrl+Alt+T new windows, keyboard operate custom commands/remote/encoding, ESC return focus

name: "键盘交互-多窗口中操作"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: Ctrl+Alt+T新建终端窗口"
    action: keyboard_hot_key
    keys: "ctrl+alt+t"
    wait: 2.0
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤2: Alt键打开主菜单"
    action: keyboard_press
    key: "Alt"
    wait: 0.5

  - name: "步骤3: 方向键导航到自定义命令"
    action: keyboard_press
    key: "Down"
    wait: 0.3

  - name: "步骤4: Enter键打开自定义命令"
    action: keyboard_press
    key: "Enter"
    wait: 1.0

  - name: "步骤5: ESC键关闭自定义命令并返回焦点"
    action: keyboard_press
    key: "Escape"
    wait: 0.5

  - name: "步骤6: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤7: ESC全局关闭聚焦窗口的菜单"
    action: keyboard_press
    key: "Escape"
    wait: 0.5

  - name: "验证焦点返回终端"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
