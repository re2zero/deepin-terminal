# Test case 106: 自定义命令
# Module: 右键菜单工作区(#116125)
# Priority: 2

name: "自定义命令"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 打开主菜单-自定义命令"
    action: main_menu_comb
    ref: menu_custom_commands
  - action: wait
    duration: 1.0

  - name: "步骤1: 截图-自定义命令面板显示"
    action: screenshot
    desc: "右侧出现自定义命令栏"

  - name: "步骤1: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤2: 点击添加自定义命令按钮"
    action: element_action
    ref: add_server_button
    do: "click"
  - action: wait
    duration: 0.5

  - name: "步骤2: 截图-添加自定义命令界面"
    action: screenshot
    desc: "进入添加自定义命令界面"

  - name: "步骤3: 点击终端内容区域使面板隐藏"
    action: element_action
    ref: terminal_content
    do: "click"
  - action: wait
    duration: 0.5

  - name: "步骤3: 截图-点击终端后面板隐藏"
    action: screenshot
    desc: "自定义命令栏隐藏"

  - name: "步骤3: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
