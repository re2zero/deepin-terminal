name: 输入命令
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 点击添加自定义命令
    2. 分别点击取消/右上角x/按esc键
    3. 命令栏输入一般个数的汉字/字母/数字
    4. 命令栏输入过多个数的汉字/字母/数字
    5. 输入特殊字符：！！@#￥%&等
    6. 输入字母、数字、汉字、特殊字符混合命令
  预期结果:
    1. 弹出自定义命令添加窗口
    2. 退出窗口，新建取消，回退到到添加命令栏
    3. 可正常输入
    4. 可正常输入，超过32字符，输入框允许输入
    5. 可正常输入
    6. 可正常输入
module: 自定义命令
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653023'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 主菜单打开自定义命令'
  action: main_menu_comb
  ref: menu_custom_commands
- action: wait
  duration: 0.3
- name: '步骤1: 截图-自定义命令列表界面'
  action: noop
- name: '步骤2: 点击添加命令按钮打开添加对话框'
  action: element_action
  ref: add_custom_command_button
  do: click
- action: wait
  duration: 0.3
- name: '步骤3: 点击命令输入框并输入一般命令'
  action: element_action
  ref: custom_command_command_input
  do: click
- action: wait
  duration: 0.3
- action: keyboard_type
  value: ls -la /home
  wait: 0.3
- name: '步骤3: 截图-一般命令输入'
  action: noop
- name: '步骤4: 清除后输入超长命令超过32字符'
  action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_type
  value: ThisIsAVeryLongCommandStringExceedingThirtyTwoChars
  wait: 0.3
- name: '步骤4: 截图-超长命令输入'
  action: noop
- name: '步骤5: 清除后输入特殊字符命令'
  action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_type
  value: echo !!!@#$$%
  wait: 0.3
- name: '步骤5: 截图-特殊字符命令输入'
  action: noop
- name: 按Escape退出自定义命令
  action: keyboard_press
  key: Escape
- action: wait
  duration: 0.3
- name: 验证终端仍在运行
  action: wait
  value: '1000'
teardown:
- action: session_stop
