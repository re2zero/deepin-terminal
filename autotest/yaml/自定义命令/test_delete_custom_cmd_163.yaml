name: 删除
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开终端，新建多个工作区，鼠标点击工作区X图标
    2. 使用快捷键alt+w
  预期结果:
    1. 删除工作区
    2. 删除工作区
module: 工作区
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653601'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '前置: 通过主菜单打开自定义命令面板并添加测试命令'
  action: main_menu_comb
  ref: menu_custom_commands
  wait: 0.3
- name: '前置: 添加第一个自定义命令'
  action: element_action
  ref: add_custom_command_button
  do: click
- action: wait
  duration: 0.3
- action: element_set_value
  ref: custom_command_name_input
  value: 待删除命令
- action: element_set_value
  ref: custom_command_command_input
  value: echo delete
- action: element_action
  ref: custom_command_add
  do: click
- action: wait
  duration: 0.3
- name: '前置: 添加第二个自定义命令'
  action: element_action
  ref: add_custom_command_button
  do: click
- action: wait
  duration: 0.3
- action: element_set_value
  ref: custom_command_name_input
  value: 保留命令
- action: element_set_value
  ref: custom_command_command_input
  value: echo keep
- action: element_action
  ref: custom_command_add
  do: click
- action: wait
  duration: 0.3
- name: '步骤1: 选中自定义命令，点击编辑'
  action: element_action
  ref: custom_command_list
  do: click
- action: wait
  duration: 0.3
- name: '步骤2: 点击删除命令并确认'
  action: element_action
  ref: custom_command_delete
  do: click
- action: wait
  duration: 0.3
- action: element_action
  ref: exit_confirm
  do: click
- action: wait
  duration: 0.3
- name: '步骤2: 验证成功删除（终端仍在运行）'
  action: wait
  value: '1000'
- name: '步骤3: 再次选中命令，点击编辑然后点删除并取消'
  action: element_action
  ref: custom_command_list
  do: click
- action: wait
  duration: 0.3
- action: element_action
  ref: custom_command_delete
  do: click
- action: wait
  duration: 0.3
- action: element_action
  ref: exit_cancel
  do: click
- action: wait
  duration: 0.3
- name: '步骤3: 验证取消删除后列表信息未变（终端仍在运行）'
  action: wait
  value: '1000'
teardown:
- action: session_stop
