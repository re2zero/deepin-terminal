name: 运行
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 新建自定义命令:名称：深度音乐  命令：deepin-music    快捷键：crtl+p（或者无）点击添加
    2. 终端中键盘敲入ctrl+p（有快捷键的情况下）
    3. 进入终端自定义命令列表，点击名为深度音乐的命令
    4. 修改命令为sayonara（未安装的软件或者服务），修改名称为测试，保存
    5. 终端中键盘敲入ctrl+p（有快捷键的情况下）
    6. 进入终端自定义命令列表，点击名为测试的命令
    7. 进入远程服务器后，点击自定义命令，查看软件显示
  预期结果:
    1. 成功添加到自定义命令列表
    2. 成功开启深度音乐
    3. 系统成功开启深度音乐
    4. 修改成功
    5. 不会开启相应服务或者软件
    6. 没有开启服务或这软件，终端有相应信息提示
    7. 在远程服务器上也可以正常运行自定义命令
module: 自定义命令
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653007'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 通过主菜单打开自定义命令面板并添加命令'
  action: main_menu_comb
  ref: menu_custom_commands
  wait: 0.3
- name: '步骤1: 新建自定义命令 深度音乐 deepin-music 快捷键Ctrl+Shift+M'
  action: element_action
  ref: add_custom_command_button
  do: click
- action: wait
  duration: 0.3
- action: element_set_value
  ref: custom_command_name_input
  value: 深度音乐
- action: element_set_value
  ref: custom_command_command_input
  value: echo deepin-music-test
- action: element_set_value
  ref: custom_command_shortcut_input
  value: Ctrl+Shift+M
- action: element_action
  ref: custom_command_add
  do: click
- action: wait
  duration: 0.3
- name: '步骤1: 验证成功添加到自定义命令列表'
  action: wait
  value: '1000'
- name: '步骤2: 终端中键盘敲入Ctrl+Shift+M运行自定义命令'
  action: keyboard_press
  value: ctrl+shift+m
- action: wait
  duration: 0.3
- name: '步骤2: 验证终端仍在运行'
  action: wait
  value: '1000'
- name: '步骤3: 在自定义命令列表中点击名为深度音乐的命令'
  action: element_action
  ref: custom_command_list
  do: click
- action: wait
  duration: 0.3
- name: '步骤3: 验证终端仍在运行'
  action: wait
  value: '1000'
- name: '步骤4: 修改命令为无效命令sayonara，修改名称为测试，保存'
  action: element_set_value
  ref: custom_command_name_input
  value: 测试
- action: element_set_value
  ref: custom_command_command_input
  value: sayonara
- action: element_action
  ref: custom_command_save
  do: click
- action: wait
  duration: 0.3
- name: '步骤4: 验证修改成功（终端仍在运行）'
  action: wait
  value: '1000'
- name: '步骤5: 再次按快捷键Ctrl+Shift+M，运行无效命令'
  action: keyboard_press
  value: ctrl+shift+m
- action: wait
  duration: 0.3
- name: '步骤5: 验证终端仍在运行（无效命令不会导致崩溃）'
  action: wait
  value: '1000'
teardown:
- action: session_stop
