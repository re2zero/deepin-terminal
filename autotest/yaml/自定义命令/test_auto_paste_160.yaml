name: 自动粘贴
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 终端输入命令如deepin-music，选中不执行
    2. 右键选中自定义命令-添加自定义命令-弹出添加框
    3. 输入命令名称，点击保存
    4. 对上述新建的命令进行编辑
  预期结果:
    1. 命令处于选中状态
    2. 选中的命令会自动粘贴到命令输入框中
    3. 保存成功
    4. 可以正常编辑，未出现异常
module: 自定义命令
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653017'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 终端输入命令 deepin-music，选中不执行'
  action: keyboard_type
  value: deepin-music
- action: wait
  duration: 0.3
- action: keyboard_press
  value: ctrl+a
- action: wait
  duration: 0.3
- name: '步骤2: 打开自定义命令面板（选中的命令应自动粘贴到命令输入框）'
  action: main_menu_comb
  ref: menu_custom_commands
  wait: 0.3
- name: '步骤2: 点击添加命令按钮打开添加对话框'
  action: element_action
  ref: add_custom_command_button
  do: click
- action: wait
  duration: 0.3
- name: '步骤3: 输入命令名称，点击保存'
  action: element_set_value
  ref: custom_command_name_input
  value: 深度音乐
- action: wait
  duration: 0.3
- action: element_action
  ref: custom_command_add
  do: click
- action: wait
  duration: 0.3
- name: '步骤3: 验证保存成功（终端仍在运行）'
  action: wait
  value: '1000'
- name: '步骤4: 点击列表中新建的命令进行编辑'
  action: element_action
  ref: custom_command_list
  do: click
- action: wait
  duration: 0.3
- name: '步骤4: 验证编辑未出现异常（终端仍在运行）'
  action: wait
  value: '1000'
teardown:
- action: session_stop
