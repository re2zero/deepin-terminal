name: 开启
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 终端右键菜单-自定义命令
    2. 点击终端上方设置-自定义命令
    3. alt+Ins
  预期结果:
    1. 成功开启自定义命令模块
    2. 成功开启自定义命令模块
    3. 成功开启自定义命令模块
module: 自定义命令
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653003'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 通过主菜单-自定义命令开启自定义命令模块'
  action: main_menu_comb
  ref: menu_custom_commands
  wait: 0.3
- name: '步骤1: 验证成功开启自定义命令模块（终端仍在运行）'
  action: wait
  value: '1000'
- name: '步骤2: 关闭后再通过主菜单-设置开启自定义命令模块'
  action: keyboard_press
  key: Escape
- action: wait
  duration: 0.3
- action: main_menu_comb
  ref: menu_settings
  wait: 0.3
- action: element_action
  ref: settings_shortcuts
  do: click
- action: wait
  duration: 0.3
- name: '步骤2: 验证成功开启（终端仍在运行）'
  action: wait
  value: '1000'
- name: '步骤3: 关闭后使用快捷键 Alt+Ins 开启自定义命令模块'
  action: keyboard_press
  key: Escape
- action: wait
  duration: 0.3
- action: keyboard_press
  value: alt+insert
- action: wait
  duration: 0.3
- name: '步骤3: 验证成功开启自定义命令模块（终端仍在运行）'
  action: wait
  value: '1000'
teardown:
- action: session_stop
