name: 键盘交互删除命令
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 进入到删除命令界面，按Tab键
    2. 在“取消”和“确定”按钮按下空格或者回车
    3. 按ESC键
    4. 删除后下一项命令还存在
    5. 删除后下一项命令不存在
    6. 删除后不存在自定义命令
  （PS：测试时需要测试Shift+Tab反向切换）
  预期结果:
    1. 焦点依次在右上角X键，取消，确定
    2. 执行相应功能操作
    3. 焦点返回到当前选择删除的自定义命令上
    4. 默认选择删除自定义命令下一项
    5. 默认选择到当前删除项的上一项
    6. 焦点回到添加命令按钮
module: 键盘交互
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653531'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: 打开自定义命令插件
  action: main_menu_comb
  ref: main_menu_button
  assert:
  - type: element_visible
  selector: null
  role: list
  items:
  - 自定义命令
- name: Tab切换到自定义命令列表
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: 按右方向键聚焦编辑按钮
  action: keyboard_press
  key: Right
  wait: 0.3
- name: 按Enter打开编辑对话框
  action: keyboard_press
  key: Return
  wait: 0.3
- name: 验证编辑对话框打开
  action: wait
  assert:
  - type: element_visible
  selector: null
  role: text
- name: Tab键导航到删除命令按钮
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: 继续Tab到删除命令
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: 再Tab到删除命令按钮
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: 按Enter打开删除确认对话框
  action: keyboard_press
  key: Return
  wait: 0.3
- name: 按Tab键切换到取消按钮
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: 再Tab切换到确定（删除）按钮
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: 按ESC退出删除确认对话框
  action: keyboard_press
  key: Escape
  wait: 0.3
- name: 验证返回编辑对话框
  action: wait
  assert:
  - type: element_visible
  selector: null
  role: text
- name: 按ESC退出编辑对话框返回命令列表
  action: keyboard_press
  key: Escape
  wait: 0.3
- name: 验证终端进程运行中
  action: wait
  value: '1000'
teardown:
- action: session_stop
