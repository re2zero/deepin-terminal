name: 键盘交互自定义命令搜索有结果
app: deepin-terminal
screenshot: false
description: |
  前置条件: 列表有2个以上命令
  测试步骤:
    1. 打开终端，Tab键切换到自定义命令插件
    2. 输入字符，按Enter键，搜索结果有显示
    3. 按Tab键
    4. 按“→”方向键
    5. 按“←”方向键
    6. 按“↑”、“↓”方向键
    7. 按Enter键
    8. 当焦点在返回键、自定义命令列表、编辑按钮时按ES
  （PS：测试时需要测试Shift+Tab反向切换）
  预期结果:
    1. 搜索框有Focus效果
    2. 返回键有Focus效果，按“←”方向键/Enter/Space键返回到搜索框
    3. 自定义命令有Focus效果
    4. 编辑按钮有边框效果
    5. 自定义命令边框有Focus效果
    6. 切换自定义命令，选中的自定义命令有Focus效果，切换到最上、最下一个自定义命令时，有提示音
    7. 执行自定义命令
    8. 焦点回到终端
module: 键盘交互
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653537'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: 打开自定义命令插件
  action: main_menu_comb
  ref: main_menu_button
  assert:
  - type: element_visible
  selector: null
  role: list
  items:
  - 自定义命令
- name: 验证搜索框有Focus效果
  action: wait
  assert:
  - type: element_visible
  selector: null
  role: text
- name: 输入搜索字符
  action: element_set_value
  ref: custom_command_search_box
  value: ls
  wait: 0.3
- name: 按Enter键确认搜索（有结果显示）
  action: keyboard_press
  key: Return
  wait: 0.3
- name: 按Tab键切换到搜索结果列表（自定义命令有Focus）
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: 验证自定义命令列表可见
  action: wait
  assert:
  - type: element_visible
  selector: null
  role: list
- name: 按右方向键（编辑按钮有边框效果）
  action: keyboard_press
  key: Right
  wait: 0.3
- name: 按左方向键（自定义命令边框有Focus效果）
  action: keyboard_press
  key: Left
  wait: 0.3
- name: 按下箭头键切换自定义命令
  action: keyboard_press
  key: Down
  wait: 0.3
- name: 按上箭头键切换
  action: keyboard_press
  key: Up
  wait: 0.3
- name: 按Enter执行选中的自定义命令
  action: keyboard_press
  key: Return
  wait: 0.3
- name: 按ESC焦点回到终端
  action: keyboard_press
  key: Escape
  wait: 0.3
- name: 验证终端进程运行中
  action: wait
  value: '1000'
teardown:
- action: session_stop
