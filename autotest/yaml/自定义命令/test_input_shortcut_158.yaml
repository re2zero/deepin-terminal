name: 键入快捷键
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 点击添加自定义命令
    2. 分别点击取消 、右上角x;
    3. 鼠标点击快捷键栏输入栏，键盘只敲字母或者数字符号
    4. 鼠标点击快捷键输入栏，键盘敲入ctrl/alt/shift+字母/符号
    5. 鼠标点击快捷键输入栏，键盘敲入ctrl+shift/alt+字母/符号
    6. 鼠标点击快捷键输入栏，键盘敲入ctrl+tab+字母/符号
    7. 鼠标点击快捷键输入栏，键盘敲入ctrl+shift/alt+双字符
    8. 鼠标点击快捷键输入栏，键盘敲入ctrl/shift/alt+字母/数字
  预期结果:
    1. 弹出添加自定义窗口
    2. 退出添加窗口，回到添加自定义栏
    3. 不能正常敲入
    4. 可以正常敲入且显示正常
    5. 可以再次敲入且显示正常
    6. 提示“快捷键Ctrl+Tab已被占用，请重新设置”
    7. 只能敲入单字符
    8. 可以正常敲入
module: 自定义命令
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653021'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 主菜单打开自定义命令'
  action: main_menu_comb
  ref: menu_custom_commands
- action: wait
  duration: 0.3
- name: '步骤1: 截图-自定义命令列表界面'
  action: noop
- name: '步骤3: 点击快捷键输入栏'
  action: element_action
  ref: custom_command_shortcut_input
  do: click
- action: wait
  duration: 0.3
- name: '步骤3: 敲单个字母测试'
  action: keyboard_press
  key: a
- action: wait
  duration: 0.3
- name: '步骤3: 截图-单个字母不能正常敲入'
  action: noop
- name: '步骤4: 敲入Ctrl+Shift+字母组合键'
  action: keyboard_press
  value: ctrl+shift+a
- action: wait
  duration: 0.3
- name: '步骤4: 截图-快捷键Ctrl+Shift+A输入'
  action: noop
- name: '步骤5: 清除后再敲入Ctrl+Shift+Alt+字母'
  action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  key: BackSpace
  wait: 0.1
- action: keyboard_press
  value: ctrl+shift+alt+b
- action: wait
  duration: 0.3
- name: '步骤5: 截图-多个修饰键组合快捷键'
  action: noop
- name: 按Escape退出自定义命令
  action: keyboard_press
  key: Escape
- action: wait
  duration: 0.3
- name: 验证终端仍在运行
  action: wait
  value: '1000'
teardown:
- action: session_stop
