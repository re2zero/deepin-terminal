# YAML test case for terminal - 设置标签标题编号后，对标签页进行分屏操作
name: "设置标签标题编号后，对标签页进行分屏操作"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:

  - name: "右键打开设置对话框"
    action: context_menu_comb
    ref: context_settings
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: "dialog"

  - name: "截图-设置对话框"
    action: screenshot
    desc: "设置对话框打开"

  - name: "点击标签标题设置"
    action: element_action
    ref: settings_tab_title
    do: "click"
    wait: 0.3

  - name: "截图-标签标题设置页面"
    action: screenshot
    desc: "标签标题设置页面，标签标题格式设置为会话编号"

  - name: "关闭设置对话框"
    action: element_action
    ref: settings_close_button
    do: "click"
    wait: 0.3

  - name: "横向分屏"
    action: context_menu_comb
    ref: context_horizontal_split
    wait: 1.5

  - name: "截图-横向分屏后"
    action: screenshot
    desc: "横向分屏后标签会话编号递增显示"

  - name: "纵向分屏"
    action: context_menu_comb
    ref: context_vertical_split
    wait: 1.5

  - name: "截图-纵向分屏后"
    action: screenshot
    desc: "纵向分屏后标签会话编号继续递增，显示所选终端会话编号"

  - name: "验证进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
