# Test case 126: 错误密码
# Module: 远程管理器(#116129)
# Priority: 2
name: "错误密码"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 打开远程管理插件，添加新服务器"
    action: main_menu_comb
    ref: menu_remote_management
  - action: wait
    duration: 0.3

  - name: "Tab到添加服务器按钮，按Enter打开添加窗口"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.3

  - name: "填写服务器名称"
    action: keyboard_type_text
    text: "test-wrong-pwd"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3

  - name: "填写服务器地址"
    action: keyboard_type_text
    text: "192.168.1.100"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3

  - name: "填写端口"
    action: keyboard_type_text
    text: "22"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3

  - name: "填写用户名"
    action: keyboard_type_text
    text: "testuser"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3

  - name: "填写错误密码"
    action: keyboard_type_text
    text: "wrongpassword123"
  - action: wait
    duration: 0.3

  - name: "按ESC取消添加（不实际连接）"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "步骤2: 再次打开添加窗口测试正确密码流程"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.3

  - name: "按ESC关闭添加窗口"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "按ESC关闭远程管理面板"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
