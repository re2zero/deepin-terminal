name: 光标闪烁复选框切换
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开设置界面，检查光标闪烁
    2. 去掉勾选，检查光标显示
    3. 检查配置文件cat ~/.config/deepin/deepin-terminal/config.conf
  预期结果:
    1. 默认勾选，即光标会自动闪烁
    2. 光标不闪烁
    3. advanced.cursor.cursor_blink=true 表示闪烁；false表示不闪烁
module: 设置界面高级设置
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653319'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 通过主菜单打开设置'
  action: main_menu_comb
  ref: menu_settings
  wait: 0.3
- name: '步骤2: 点击光标设置导航项'
  action: element_action
  ref: settings_cursor
  do: click
  wait: 0.3
- name: '步骤3: Tab键将焦点移到光标闪烁复选框（默认勾选）'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤4: 再次Tab键确保焦点在目标复选框'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤5: Space键取消勾选光标闪烁'
  action: keyboard_press
  key: Space
  wait: 0.3
- name: '步骤6: Shift+Tab反向切换焦点'
  action: keyboard_press
  value: Shift,Tab
  wait: 0.3
- name: '步骤7: 再次Tab到复选框并Space恢复勾选'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤8: Tab键确保焦点在复选框'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤9: Space键恢复勾选光标闪烁'
  action: keyboard_press
  key: Space
  wait: 0.3
- name: '步骤10: ESC关闭设置窗口'
  action: keyboard_press
  key: Escape
  wait: 0.3
- name: 验证终端进程运行中
  action: wait
  value: '1000'
teardown:
- action: session_stop
