# Test case 132: 上传文件
# Module: 远程管理器(#116129)
# Priority: 1
# Steps:
#   1. 在终端远程管理面板，选择一个服务器登录
#   2. 在终端界面点击右键
#   3. 选择上传文件选项
#   4. 选择需要上传的文件
#   5. 点击上传
# Expected:
#   1. 服务器登录成功
#   2. 弹出菜单栏
#   3. 弹出选择文件窗口
#   4. 文件可以选择
#   5. 文件被上传到服务器

name: "上传文件"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:

  - name: "步骤1: 主菜单打开远程管理面板"
    action: main_menu_comb
    ref: menu_remote_management
    wait: 0.3

  - name: "步骤1: 选择远程管理列表中的服务器"
    action: element_action
    ref: remote_server_list
    do: "click"
    wait: 0.3

  - name: "步骤1: 连接服务器登录"
    action: keyboard_press
    key: "Return"
    wait: 0.3

  - name: "步骤2: 右键点击终端区域调出菜单"
    action: context_menu_comb
    ref: context_remote_management
    wait: 0.3

  - name: "步骤3: 选择上传文件选项"
    action: context_menu_comb
    ref: context_upload_file
    wait: 0.3

  - name: "步骤4: 文件选择对话框弹出"
    action: screenshot
    desc: "弹出选择文件窗口，可以选择文件"

  - name: "步骤5: 按ESC关闭文件选择对话框"
    action: keyboard_press
    key: "Escape"
    wait: 0.3

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
