# Test case 155: [009]终端快捷键
# Module: 快捷键(#116133)
# Priority: 1

name: "[009]终端快捷键"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 正常窗口按Ctrl+Shift+?显示快捷键面板"
    action: keyboard_hot_key
    keys: "ctrl+shift+?"
  - action: wait
    duration: 1.0

  - name: "步骤1: 截图-快捷键面板显示在窗口中间"
    action: screenshot
    desc: "快捷键显示在窗口中间，文案与需求一致"

  - name: "步骤1: 按Escape关闭快捷键面板"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.5

  - name: "步骤3: 按Ctrl+Shift+?再次打开快捷键面板"
    action: keyboard_hot_key
    keys: "ctrl+shift+?"
  - action: wait
    duration: 1.0

  - name: "步骤3: 截图-快捷键面板再次显示"
    action: screenshot
    desc: "快捷键面板再次显示在窗口中间"

  - name: "步骤3: 按Escape关闭快捷键面板"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.5

  - name: "步骤3: 按Ctrl+Shift+?打开然后不松开快捷键"
    action: keyboard_hot_key
    keys: "ctrl+shift+?"
  - action: wait
    duration: 1.0

  - name: "步骤3: 松开后截图-面板不消失"
    action: screenshot
    desc: "松开键盘后快捷键窗口不消失"

  - name: "按Escape关闭并验证终端运行中"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.5
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
