# Test case 169: [005]雷神窗口显示
# Module: /V25_2500（测试部专用）/B类解耦商店应用/终端/104X(#116091)
# Priority: 1

name: "[005]雷神窗口显示"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 验证主窗口可见"
    action: element_action
    ref: main_frame
    do: "click"
    assert:
      - type: element_visible
        selector:
          role: "frame"

  - name: "步骤2: 使用Alt+F2调出雷神终端"
    action: keyboard_hot_key
    keys: "Alt,F2"
    wait: 2.0

  - name: "步骤3: 截图-雷神窗口初始显示"
    action: screenshot
    desc: "雷神窗口从上滑下，占屏幕1/3高度"

  - name: "步骤4: 鼠标拖拽窗口底部调整高度"
    action: keyboard_press
    key: "Escape"
    wait: 1.0

  - name: "步骤5: Alt+F2再次打开雷神窗口"
    action: keyboard_hot_key
    keys: "Alt,F2"
    wait: 2.0

  - name: "步骤6: 截图-雷神窗口保持上次高度"
    action: screenshot
    desc: "雷神窗口记录上次修改的高度"

  - name: "步骤7: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
