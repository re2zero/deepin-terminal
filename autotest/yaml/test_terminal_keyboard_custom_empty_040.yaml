# 键盘交互：自定义列表为空
# Keyboard interaction: custom command list empty
# Tab to main menu, Space/Enter to open, arrow/Tab to custom commands, Enter

name: "键盘交互-自定义列表为空"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "Tab键切换到主菜单"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "Space键打开主菜单"
    action: keyboard_press
    key: "Space"
    wait: 0.3

  - name: "通过主菜单打开自定义命令"
    action: main_menu_comb
    ref: menu_custom_commands
    wait: 0.3

  - name: "验证自定义命令列表显示"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "Tab键切换到添加命令按钮"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "再次Tab键确保焦点在添加命令按钮"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "Escape关闭自定义命令列表"
    action: keyboard_press
    key: "Escape"
    wait: 0.3

  - name: "验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
