# Test case 107: 编码方式
# Module: 右键菜单工作区(#116125)
# Priority: 2

name: "编码方式"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 右键菜单点击编码项"
    action: context_menu_comb
    ref: context_encoding
  - action: wait
    duration: 0.3

  - name: "步骤1: 验证编码列表显示"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤1: 截图-编码列表显示"
    action: screenshot
    desc: "列出所有可用的编码格式"

  - name: "步骤1: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤2: 鼠标滚动查看编码列表"
    action: mouse_scroll
    amount: -3
  - action: wait
    duration: 0.3
  - action: mouse_scroll
    amount: 3
  - action: wait
    duration: 0.3

  - name: "步骤2: 截图-编码列表滚动后"
    action: screenshot
    desc: "下拉列表可以查看所有的可选编码"

  - name: "步骤4: 点击终端内容区域使编码列表隐藏"
    action: element_action
    ref: terminal_content
    do: "click"
  - action: wait
    duration: 0.3

  - name: "步骤4: 截图-点击终端后编码列表隐藏"
    action: screenshot
    desc: "编码列表隐藏"

  - name: "步骤4: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
