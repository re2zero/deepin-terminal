# UNSUPPORTED: 触摸操作无法自动化
name: '触摸屏删除自定义命令功能 - NON-AUTOMATABLE: 触摸操作无法自动化'
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开终端，长按右键
    2. 点击右键菜单自定义命令
    3. 选择一个命令，点击编辑
    4. 点击删除命令
    5. 点击右上角x键或取消按钮
    6. 点击确定按钮
  预期结果:
    1. 弹出右键菜单
    2. 显示自定义命令插件
    3. 弹出编辑自定义界面，名称全选
    4. 弹出删除命令弹框
    5. 退出删除弹框
    6. 当前编辑的命令被删除
module: 触摸屏
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653465'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: 跳过 - skip-触摸操作无法自动化
  action: wait
  value: '300'
- name: 验证终端进程运行中
  action: wait
  value: '1000'
teardown:
- action: session_stop
