# Test case 177: 关于2
# Module: /V25_2500（测试部专用）/B类解耦商店应用/终端/104X/主界面右上角菜单栏(#116141)
# Priority: 2

name: "关于2"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 验证主窗口可见"
    action: element_action
    ref: main_frame
    do: "click"
    assert:
      - type: element_visible
        selector:
          role: "frame"

  - name: "步骤2: 通过主菜单打开关于"
    action: main_menu_comb
    ref: menu_about
    wait: 1.0
    assert:
      - type: element_visible
        ref: about_dialog

  - name: "步骤3: 截图-关于窗口内容"
    action: screenshot
    desc: "关于窗口内容显示正确"

  - name: "步骤4: 点击关于窗口右上角关闭按钮"
    action: element_action
    ref: settings_close_button
    do: "click"
    wait: 1.0

  - name: "步骤5: 通过主菜单再次打开关于"
    action: main_menu_comb
    ref: menu_about
    wait: 1.0
    assert:
      - type: element_visible
        ref: about_dialog

  - name: "步骤6: 按ESC键关闭关于窗口"
    action: keyboard_press
    key: "Escape"
    wait: 1.0

  - name: "步骤7: 通过主菜单再次打开关于"
    action: main_menu_comb
    ref: menu_about
    wait: 1.0
    assert:
      - type: element_visible
        ref: about_dialog

  - name: "步骤8: 按Alt+F4关闭关于窗口"
    action: keyboard_hot_key
    keys: "Alt,F4"
    wait: 1.0

  - name: "步骤9: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
