# Test case 122: 搜索服务器
# Module: 远程管理器(#116129)
# Priority: 2
name: "搜索服务器"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 打开远程管理查看搜索按钮"
    action: main_menu_comb
    ref: menu_remote_management
  - action: wait
    duration: 1.0
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤2: Tab到搜索框并点击进入"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - name: "点击搜索框获取焦点"
    action: element_action
    ref: remote_search_box
    do: "click"
  - action: wait
    duration: 0.5

  - name: "步骤3: 输入特殊字符搜索"
    action: keyboard_type_text
    text: "@#$%^&*()"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.5

  - name: "清空搜索框"
    action: keyboard_hot_key
    keys: "ctrl+a"
  - action: wait
    duration: 0.2
  - action: keyboard_press
    key: "BackSpace"
  - action: wait
    duration: 0.3

  - name: "步骤4: 输入服务器名称搜索"
    action: keyboard_type_text
    text: "test-server"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.5

  - name: "清空搜索框"
    action: keyboard_hot_key
    keys: "ctrl+a"
  - action: wait
    duration: 0.2
  - action: keyboard_press
    key: "BackSpace"
  - action: wait
    duration: 0.3

  - name: "步骤5: 输入IP地址搜索"
    action: keyboard_type_text
    text: "192.168.1.1"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.5

  - name: "清空搜索框"
    action: keyboard_hot_key
    keys: "ctrl+a"
  - action: wait
    duration: 0.2
  - action: keyboard_press
    key: "BackSpace"
  - action: wait
    duration: 0.3

  - name: "步骤6: 输入分组名称搜索"
    action: keyboard_type_text
    text: "group-test"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.5

  - name: "步骤7: 输入字符后删除"
    action: keyboard_hot_key
    keys: "ctrl+a"
  - action: wait
    duration: 0.2
  - action: keyboard_press
    key: "BackSpace"
  - action: wait
    duration: 0.3
  - name: "再次输入后删除确认清空"
    action: keyboard_type_text
    text: "abc"
  - action: wait
    duration: 0.3
  - action: keyboard_hot_key
    keys: "ctrl+a"
  - action: wait
    duration: 0.2
  - action: keyboard_press
    key: "BackSpace"
  - action: wait
    duration: 0.3

  - name: "按ESC关闭远程管理面板"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.5

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
