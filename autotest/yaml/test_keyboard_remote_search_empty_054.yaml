# Test case 054: 键盘交互远程管理搜索结果为空
# Module: 键盘交互(#116109)
# Priority: 2

name: "键盘交互-远程搜索为空"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 打开远程管理插件"
    action: main_menu_comb
    ref: menu_remote_management
  - action: wait
    duration: 1.0

  - name: "步骤2: 搜索框不输入字符，按Enter键"
    action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.5

  - name: "步骤3: 输入搜索字符后按Enter，搜索无结果"
    action: element_action
    ref: remote_search_box
    do: "click"
  - action: wait
    duration: 0.3
  - action: keyboard_type_text
    text: "zxcvbnm_nonexistent"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.5

  - name: "步骤3: 按←方向键返回到搜索框"
    action: keyboard_press
    key: "Left"
  - action: wait
    duration: 0.3

  - name: "Shift+Tab反向切换测试"
    action: keyboard_hot_key
    keys: "shift,Tab"
  - action: wait
    duration: 0.5

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
