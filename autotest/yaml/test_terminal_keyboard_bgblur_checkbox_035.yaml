# 键盘交互：焦点在背景模糊复选框
# Keyboard interaction: focus on background blur checkbox
# Use Space/Enter to toggle, Shift+Tab for reverse navigation

name: "键盘交互-背景模糊复选框"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "通过主菜单打开设置"
    action: main_menu_comb
    ref: menu_settings
    wait: 1.0
    assert:
      - type: element_visible
        ref: settings_dialog

  - name: "点击界面设置导航项"
    action: element_action
    ref: settings_interface
    do: "click"
    wait: 0.5

  - name: "Tab键将焦点移到背景模糊复选框"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "Space键切换复选框状态"
    action: keyboard_press
    key: "Space"
    wait: 0.3

  - name: "Shift+Tab反向切换焦点"
    action: keyboard_hot_key
    keys: "Shift,Tab"
    wait: 0.3

  - name: "再次Tab到复选框并使用Enter切换"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "Enter键切换复选框状态"
    action: keyboard_press
    key: "Enter"
    wait: 0.3

  - name: "Escape关闭设置窗口"
    action: keyboard_press
    key: "Escape"
    wait: 0.5

  - name: "验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
