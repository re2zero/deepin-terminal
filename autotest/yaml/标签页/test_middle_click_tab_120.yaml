name: 鼠标指针在标签页上，点击鼠标中键
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开终端，鼠标指针指在标签页，点击鼠标中键
    2. 再次打开终端，点击“+”按钮新建多个标签页，鼠标指针指在未获得焦点的标签页，点击鼠标中键
    3. 终端窗口中做横向分屏纵向分屏操作，鼠标指针指在分屏窗口标签页处，点击鼠标中键
  预期结果:
    1. 终端窗口被关闭
    2. 当前标签页被关闭
    3. 当前分屏标签页窗口被关闭
module: 右键菜单标签页
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653153'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 鼠标指向标签页，点击鼠标中键'
  action: element_action
  ref: tab_list
  do: middle_click
- action: wait
  duration: 0.3
- name: '步骤2: 新建多个标签页'
  action: element_action
  ref: add_tab_button
  do: click
- action: wait
  duration: 0.3
- action: element_action
  ref: add_tab_button
  do: click
- action: wait
  duration: 0.3
- name: 鼠标中键点击标签页关闭当前标签
  action: element_action
  ref: tab_list
  do: middle_click
- action: wait
  duration: 0.3
- name: '步骤3: 先做横向分屏'
  action: context_menu_comb
  ref: context_horizontal_split
- action: wait
  duration: 0.3
- name: 再做纵向分屏
  action: context_menu_comb
  ref: context_vertical_split
- action: wait
  duration: 0.3
- name: 鼠标中键点击分屏窗口标签页
  action: element_action
  ref: tab_list
  do: middle_click
- action: wait
  duration: 0.3
teardown:
- action: session_stop
