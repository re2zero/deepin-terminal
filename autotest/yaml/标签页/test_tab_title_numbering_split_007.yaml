name: 设置标签标题编号后，对标签页进行分屏操作
app: deepin-terminal
screenshot: false
description: |
  前置条件: 设置中标签的标签标题格式为会话编号%#
  测试步骤:
    1. 打开终端，进行横向分屏/纵向分屏操作
  预期结果:
    1. 1当前的标签会话编号也会随之递增，且会话编号显示的是所选的终端的会话编号
module: 查找
feature: ''
tags:
- L3
vars:
  XLSX_ID: '1653613'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: 右键打开设置对话框
  action: context_menu_comb
  ref: context_settings
  wait: 0.3
  assert:
  - type: element_visible
  selector: null
  role: dialog
- name: 截图-设置对话框
  action: noop
- name: 点击标签标题设置
  action: element_action
  ref: settings_tab_title
  do: click
  wait: 0.3
- name: 截图-标签标题设置页面
  action: noop
- name: 关闭设置对话框
  action: element_action
  ref: settings_close_button
  do: click
  wait: 0.3
- name: 横向分屏
  action: context_menu_comb
  ref: context_horizontal_split
  wait: 1.5
- name: 截图-横向分屏后
  action: noop
- name: 纵向分屏
  action: context_menu_comb
  ref: context_vertical_split
  wait: 1.5
- name: 截图-纵向分屏后
  action: noop
- name: 验证进程运行中
  action: wait
  value: '1000'
teardown:
- action: session_stop
