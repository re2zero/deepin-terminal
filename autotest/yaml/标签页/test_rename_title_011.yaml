name: 重命名标题
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开终端，点击右键-重命名标题，查看软件显示
    2. 弹出输入对话框后，按ESC键，查看对话框显示
    3. 弹出输入对话框后，直接点击重命名，查看标题显示
    4. 弹出输入对话框后，删除原来的标题，点击重命名，查看标题栏显示
    5. 在对话框中输入任意长度字符，查看软件显示
    6. 重命名标题栏后，登录远程服务器，查看标题栏显示
    7. 重命名标题栏后，切换shell路径，查看标题栏显示
  预期结果:
    1. 软件会自动弹出输入对话框
    2. 对话框自动消失
    3. 标题栏显示不变
    4. 标题栏显示不变
    5. 可以输入任意长度，但在标题栏显示时，会以...表示
    6. 标题栏显示不变
    7. 标题栏显示不变
module: 右键菜单
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653605'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: 右键选择重命名标题
  action: context_menu_comb
  ref: context_rename_title
  wait: 0.3
- name: 截图-重命名对话框弹出
  action: noop
- name: 按ESC关闭对话框
  action: keyboard_press
  key: Escape
  wait: 0.3
- name: 截图-ESC后对话框消失
  action: noop
- name: 再次打开重命名标题
  action: context_menu_comb
  ref: context_rename_title
  wait: 0.3
- name: 直接点击确定（不改标题）
  action: keyboard_press
  key: Return
  wait: 0.3
- name: 截图-直接确认后
  action: noop
- name: 再次打开重命名标题 (2)
  action: context_menu_comb
  ref: context_rename_title
  wait: 0.3
- name: 删除原标题后确认
  action: keyboard_press
  key: BackSpace
  wait: 0.1
- name: 再按退格删除更多
  action: keyboard_press
  key: BackSpace
  wait: 0.1
- name: 继续删除
  action: keyboard_press
  key: BackSpace
  wait: 0.1
- name: 继续删除 (2)
  action: keyboard_press
  key: BackSpace
  wait: 0.1
- name: 继续删除 (3)
  action: keyboard_press
  key: BackSpace
  wait: 0.3
- name: 按回车确认空标题
  action: keyboard_press
  key: Return
  wait: 0.3
- name: 截图-空标题确认后
  action: noop
- name: 再次打开重命名标题 (3)
  action: context_menu_comb
  ref: context_rename_title
  wait: 0.3
- name: 输入超长标题
  action: keyboard_type
  value: ThisIsAVeryLongTitleNameForTestingPurposesWithManyCharactersExceedingNormalLength
  wait: 0.3
- name: 截图-超长标题输入
  action: noop
- name: 按回车确认
  action: keyboard_press
  key: Return
  wait: 0.3
- name: 截图-超长标题在标题栏显示
  action: noop
- name: 验证进程运行中
  action: wait
  value: '1000'
teardown:
- action: session_stop
