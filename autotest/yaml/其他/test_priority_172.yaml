name: 优先级
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 终端设置中设置窗口启动为全屏模式，右侧上方设置中点击关闭;新建窗口;
    2. 终端输入deepin-terminal -m normal
  预期结果:
    1. 新建的窗口为全屏模式
    2. 弹出的窗口为正常窗口
module: 104X
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1652975'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤2: 通过主菜单打开设置'
  action: main_menu_comb
  ref: menu_settings
  wait: 0.3
- name: '步骤3: 点击窗口设置导航项'
  action: element_action
  ref: settings_window
  do: click
  wait: 0.3
- name: '步骤4: Tab键定位启动窗口模式下拉框'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤5: 再次Tab键定位目标'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤6: Space键展开下拉框'
  action: keyboard_press
  key: Space
  wait: 0.3
- name: '步骤7: Down键选择全屏模式'
  action: keyboard_press
  key: Down
  wait: 0.3
- name: '步骤8: Enter键确认选择全屏模式'
  action: keyboard_press
  key: Enter
  wait: 0.3
- name: '步骤9: Tab键将焦点移到关闭按钮'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤10: Enter键关闭设置窗口'
  action: keyboard_press
  key: Enter
  wait: 0.3
- name: '步骤11: Ctrl+Shift+T新建标签验证全屏模式生效'
  action: keyboard_press
  value: ctrl+shift+t
  wait: 2.0
- name: '步骤12: 截图-新建窗口为全屏模式'
  action: noop
- name: '步骤13: 在终端输入deepin-terminal -m normal'
  action: keyboard_type
  value: deepin-terminal -m normal
  wait: 0.3
- name: '步骤14: 回车执行'
  action: keyboard_press
  key: Return
  wait: 2.0
- name: '步骤15: 截图-命令行参数优先级更高'
  action: noop
- name: '步骤16: 关闭新窗口'
  action: keyboard_press
  value: Alt,F4
  wait: 0.3
- name: '步骤17: 验证终端进程运行中'
  action: wait
  value: '1000'
teardown:
- action: session_stop
