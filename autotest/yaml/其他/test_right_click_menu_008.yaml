# UNSUPPORTED: 需要letmego支持重启
name: '右键菜单 - NON-AUTOMATABLE: 需要letmego支持重启'
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开终端，系统有信息复制到粘贴板上时，且开启最少分屏，空白处右键菜单
    2. 注销系统或者重启后，不做其他任何操作，右键
    3. 登录远程服务器，右键菜单显示
    4. 打开雷神终端，空白处右键
  预期结果:
    1. 粘贴、横向分屏、纵向分屏、关闭窗口、关闭其他窗口、新建工作区、全屏搜索远程管理、设置
    2. 没有粘贴和关闭其他窗口，其他都有
    3. 粘贴、横向分屏、纵向分屏、关闭窗口、关闭其他窗口、新建工作区、全屏搜索远程管理、上传文件、下载文件、设置
    4. 粘贴、横向分屏、纵向分屏、关闭窗口、关闭其他窗口、新建工作区、全屏、搜索、远程管理、上传文件、下载文件、设置
module: 右键菜单
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653611'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: 跳过 - skip-重启类场景需要letmego支持
  action: wait
  value: '300'
- name: 验证终端进程运行中
  action: wait
  value: '1000'
teardown:
- action: session_stop
