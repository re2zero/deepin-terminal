# UNSUPPORTED: 需要letmego支持重启
name: '分割线 - NON-AUTOMATABLE: 需要letmego支持重启'
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 注销或重启后打开终端，右键菜单，不做其他任何操作
    2. 复制信息到剪切板，右键菜单，不做其他任何操作
    3. 终端添加一个分屏窗口，右键菜单
    4. 进行分屏、关闭分屏窗口、新建工作区等操作
  预期结果:
    1. 没有粘贴和关闭其他窗口；两个选项其他按摘要中的顺序排列分割
    2. 右键菜单中显示粘贴，选项，独自一个分割区
    3. 右键菜单显示;关闭其他其他窗口;选项处于横纵向分屏的分割区
    4. 排序顺序未发生异变；分割线也未发生异变
module: 右键菜单
feature: ''
tags:
- L3
vars:
  XLSX_ID: '1653607'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: 跳过 - skip-重启类场景需要letmego支持
  action: wait
  value: '300'
- name: 验证终端进程运行中
  action: wait
  value: '1000'
teardown:
- action: session_stop
