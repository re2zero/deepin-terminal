name: 键盘交互-快捷键设置
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 键入设置，Tab键切换到快捷键
    2. 按Enter键
    3. 输入新的快捷键
  （PS：测试时需要测试Shift+Tab反向切换）
  预期结果:
    1. 输入框有Focus效果
    2. 提示“请输入新的快捷键”，并有Focus效果
    3. 输入正常，并且Focus效果仍然在
module: 键盘交互
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653571'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 打开设置界面'
  action: main_menu_comb
  ref: menu_settings
- name: '步骤2: Tab键切换到快捷键区域'
  action: keyboard_press
  key: Tab
- action: keyboard_press
  key: Tab
- action: keyboard_press
  key: Tab
- name: '步骤3: 按Enter键进入快捷键编辑模式'
  action: keyboard_press
  key: Return
- name: '步骤4: 输入新的快捷键组合'
  action: keyboard_press
  value: ctrl,shift,T
- name: '步骤5: 验证设置对话框仍可见'
  action: wait
  assert:
  - type: element_visible
  selector: null
  role: dialog
- name: '步骤6: 验证终端进程运行中'
  action: wait
  value: '1000'
teardown:
- action: session_stop
