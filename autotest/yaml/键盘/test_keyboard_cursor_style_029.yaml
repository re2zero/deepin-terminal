name: 键盘交互-光标风格切换
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开设置界面，检查光标风格默认显示
    2. 修改为第二种，|
    3. 修改为第三种_
  预期结果:
    1. 显示有3种风格，默认选中第一种
    2. 光标立即生效
    3. 光标立即生效
module: 设置界面高级设置
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653321'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 打开设置界面'
  action: main_menu_comb
  ref: menu_settings
- name: '步骤2: Tab键切换到光标风格区域'
  action: keyboard_press
  key: Tab
- action: keyboard_press
  key: Tab
- action: keyboard_press
  key: Tab
- name: '步骤3: 按→方向键向右切换光标风格'
  action: keyboard_press
  key: Right
- name: '步骤4: 按Space键执行选中'
  action: keyboard_press
  key: space
- name: '步骤5: 按←方向键向左切换光标风格'
  action: keyboard_press
  key: Left
- name: '步骤6: 按Space键执行选中'
  action: keyboard_press
  key: space
- name: '步骤7: 验证设置对话框仍可见'
  action: wait
  assert:
  - type: element_visible
  selector: null
  role: dialog
- name: '步骤8: 验证终端进程运行中'
  action: wait
  value: '1000'
teardown:
- action: session_stop
