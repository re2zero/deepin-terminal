name: 键盘交互-右键菜单快捷键
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 键入设置，Tab键切换到快捷键
    2. 按Enter键
    3. 输入新的快捷键
  （PS：测试时需要测试Shift+Tab反向切换）
  预期结果:
    1. 输入框有Focus效果
    2. 提示“请输入新的快捷键”，并有Focus效果
    3. 输入正常，并且Focus效果仍然在
module: 键盘交互
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653571'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 焦点在终端，按Menu键调出右键菜单'
  action: context_menu_comb
  ref: terminal_center
- name: '步骤2: 按↑↓方向键切换菜单项'
  action: keyboard_press
  key: Down
- name: '步骤3: 按Tab键继续切换菜单'
  action: keyboard_press
  key: Tab
- name: '步骤4: 验证终端进程仍在运行'
  action: wait
  value: '1000'
teardown:
- action: session_stop
