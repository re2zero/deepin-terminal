name: 键盘交互-有一个自定义命令
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开终端，键盘按Tab键切换到自定义插件
    2. 再次按Tab键
  （PS：测试时需要测试Shift+Tab反向切换）
  预期结果:
    1. 当前自定义命令有Focus效果
    2. 切换到添加自定义命令按钮
module: 键盘交互
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653545'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: Tab键切换到主菜单
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: Space键打开主菜单
  action: keyboard_press
  key: Space
  wait: 0.3
- name: 通过主菜单打开自定义命令
  action: main_menu_comb
  ref: menu_custom_commands
  wait: 0.3
- name: 验证自定义命令列表显示
  action: wait
  value: '1000'
- name: Tab键切换到自定义命令项
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: 再次Tab键切换到添加命令按钮
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: Shift+Tab反向切换到自定义命令
  action: keyboard_press
  value: Shift,Tab
  wait: 0.3
- name: Escape关闭列表
  action: keyboard_press
  key: Escape
  wait: 0.3
- name: 验证终端进程运行中
  action: wait
  value: '1000'
teardown:
- action: session_stop
