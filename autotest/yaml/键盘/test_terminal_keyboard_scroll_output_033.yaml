name: 键盘交互-输出时滚动复选框
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 进入设置，焦点在输出时滚动复选框
    2. 键盘按Enter键
  （PS：测试时需要测试Shift+Tab反向切换）
  预期结果:
    1. 复选框有Focus效果
    2. 取消/选中复选框
module: 键盘交互
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653561'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: 通过主菜单打开设置
  action: main_menu_comb
  ref: menu_settings
  wait: 0.3
- name: 点击滚动设置导航项
  action: element_action
  ref: settings_scroll
  do: click
  wait: 0.3
- name: Tab键将焦点移到输出时滚动复选框
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: Enter键切换复选框状态
  action: keyboard_press
  key: Enter
  wait: 0.3
- name: Shift+Tab反向切换焦点
  action: keyboard_press
  value: Shift,Tab
  wait: 0.3
- name: 再次Enter键恢复复选框状态
  action: keyboard_press
  key: Enter
  wait: 0.3
- name: Escape关闭设置窗口
  action: keyboard_press
  key: Escape
  wait: 0.3
- name: 验证终端进程运行中
  action: wait
  value: '1000'
teardown:
- action: session_stop
