name: 键盘交互-自定义列表为空
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开终端，Tab键切换到主菜单，按Space/Enter键
    2. “↑”、“↓”方向键/Tab键切换自定义命令，
    3. 按Enter键
  （PS：测试时需要测试Shift+Tab反向切换）
  预期结果:
    1. 显示主菜单列表
    2. 自定义插件打开
    3. 焦点切换到添加命令按钮
module: 键盘交互
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653547'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: Tab键切换到主菜单
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: Space键打开主菜单
  action: keyboard_press
  key: Space
  wait: 0.3
- name: 通过主菜单打开自定义命令
  action: main_menu_comb
  ref: menu_custom_commands
  wait: 0.3
- name: 验证自定义命令列表显示
  action: wait
  value: '1000'
- name: Tab键切换到添加命令按钮
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: 再次Tab键确保焦点在添加命令按钮
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: Escape关闭自定义命令列表
  action: keyboard_press
  key: Escape
  wait: 0.3
- name: 验证终端进程运行中
  action: wait
  value: '1000'
teardown:
- action: session_stop
