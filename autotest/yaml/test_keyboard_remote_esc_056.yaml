# Test case 056: 键盘交互远程管理全局功能按ESC键
# Module: 键盘交互(#116109)
# Priority: 2

name: "键盘交互-远程管理全局ESC"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 打开远程管理插件"
    action: main_menu_comb
    ref: menu_remote_management
  - action: wait
    duration: 0.3

  - name: "步骤1: 焦点在搜索框，按ESC键"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "重新打开远程管理插件"
    action: main_menu_comb
    ref: menu_remote_management
  - action: wait
    duration: 0.3

  - name: "Tab到服务器列表，按ESC键"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "重新打开远程管理插件"
    action: main_menu_comb
    ref: menu_remote_management
  - action: wait
    duration: 0.3

  - name: "Tab到编辑按钮，按ESC键"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Right"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "重新打开远程管理插件"
    action: main_menu_comb
    ref: menu_remote_management
  - action: wait
    duration: 0.3

  - name: "Tab到添加服务器按钮，按ESC键"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "Shift+Tab反向切换测试"
    action: keyboard_hot_key
    keys: "shift,Tab"
  - action: wait
    duration: 0.3

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
