# Test case 102: 透明度
# Module: 设置界面基础设置(#116123)
# Priority: 3

name: "透明度"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 打开主菜单-设置"
    action: main_menu_comb
    ref: menu_settings
  - action: wait
    duration: 1.0

  - name: "步骤1: 验证设置弹窗显示"
    action: wait
    assert:
      - type: element_visible
        ref: settings_dialog

  - name: "步骤1: 截图-设置窗口"
    action: screenshot
    desc: "设置窗口已打开"

  - name: "步骤1: 点击基础设置-界面"
    action: element_action
    ref: settings_basic
    do: "click"
  - action: wait
    duration: 0.5

  - name: "步骤1: 截图-界面设置页"
    action: screenshot
    desc: "界面设置页显示透明度选项"

  - name: "步骤1: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤2: 关闭设置窗口"
    action: element_action
    ref: settings_close_button
    do: "click"
  - action: wait
    duration: 0.5

teardown:
  - action: session_stop
