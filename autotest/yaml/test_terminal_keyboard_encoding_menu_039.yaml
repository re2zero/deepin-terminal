# 键盘交互：右键菜单调出编码
# Keyboard interaction: right-click context menu open encoding
# Alt+M → encoding plugin displays, check encoding list focus state

name: "键盘交互-右键菜单调出编码"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "Alt+M调出右键菜单选择编码"
    action: keyboard_hot_key
    keys: "Alt,M"
    wait: 0.5

  - name: "通过右键菜单打开编码"
    action: context_menu_comb
    ref: context_encoding
    wait: 1.0

  - name: "验证编码插件显示"
    action: wait
    assert:
      - type: element_visible
        ref: encoding_list

  - name: "验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
