# Test case 182: 主菜单主题
# Module: 主界面右上角菜单栏(#116141)
# Priority: 2

name: "主菜单切换主题"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 主菜单切换到深色主题"
    action: main_menu_comb
    ref: main_menu_button
    menu: ["主题", "深色"]
    wait: 0.3

  - name: "截图-深色主题效果"
    action: screenshot
    desc: "终端窗口显示深色主题"

  - name: "步骤2: 主菜单切换到跟随系统主题"
    action: main_menu_comb
    ref: main_menu_button
    menu: ["主题", "跟随系统"]
    wait: 0.3

  - name: "截图-跟随系统主题"
    action: screenshot
    desc: "终端窗口显示跟随系统主题"

  - name: "步骤3: 新建窗口后打开设置弹框"
    action: main_menu_comb
    ref: menu_new_window
    wait: 1.5

  - name: "在新窗口中通过主菜单打开设置"
    action: main_menu_comb
    ref: menu_settings
    wait: 0.3

  - name: "在设置弹框打开状态下切换主题"
    action: main_menu_comb
    ref: main_menu_button
    menu: ["主题", "跟随系统"]
    wait: 0.3

  - name: "截图-弹框字体显示"
    action: screenshot
    desc: "设置弹框字体在主题切换后显示正常"

  - name: "关闭设置弹框"
    action: keyboard_press
    key: "Escape"
    wait: 0.3

  - name: "验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
