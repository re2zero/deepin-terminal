# Test case 023: 键盘交互选中文字功能
# Module: 键盘交互(#116109)
# Priority: 2

name: "键盘交互-选中文字功能"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 键盘按Shift+←选择光标前字符"
    action: keyboard_hot_key
    keys: "shift,Left"

  - name: "步骤2: 键盘按Shift+→选择光标后字符"
    action: keyboard_hot_key
    keys: "shift,Right"

  - name: "步骤3: 右键菜单纵向分屏"
    action: context_menu_comb
    ref: context_vertical_split

  - name: "步骤4: 验证主窗口仍可见"
    action: wait
    assert:
      - type: element_visible
        selector:
          role: "frame"

  - name: "步骤5: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
