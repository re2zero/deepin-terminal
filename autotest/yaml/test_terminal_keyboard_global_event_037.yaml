# 键盘交互：焦点在设置全局事件
# Keyboard interaction: focus on settings global event
# Press ESC on settings dialog → window closes, focus returns to terminal

name: "键盘交互-设置全局事件"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "通过主菜单打开设置"
    action: main_menu_comb
    ref: menu_settings
    wait: 1.0
    assert:
      - type: element_visible
        ref: settings_dialog

  - name: "ESC键关闭设置窗口"
    action: keyboard_press
    key: "Escape"
    wait: 0.5

  - name: "验证设置窗口已关闭"
    action: wait
    assert:
      - type: element_visible
        ref: main_window

  - name: "验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
