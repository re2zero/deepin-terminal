# Test case 178: 链接
# Module: /V25_2500（测试部专用）/B类解耦商店应用/终端/104X/主界面右上角菜单栏(#116141)
# Priority: 2

name: "链接"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:

  - name: "步骤2: 通过主菜单打开关于"
    action: main_menu_comb
    ref: menu_about
    wait: 0.3
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤3: 截图-关于界面"
    action: screenshot
    desc: "关于界面弹出，显示www.chinauos.com链接"

  - name: "步骤4: Tab键定位到链接"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "步骤5: 继续Tab键定位"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "步骤6: Enter键点击链接"
    action: keyboard_press
    key: "Enter"
    wait: 0.3

  - name: "步骤7: 截图-浏览器打开UOS官网"
    action: screenshot
    desc: "成功进入UOS官网网站"

  - name: "步骤8: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
