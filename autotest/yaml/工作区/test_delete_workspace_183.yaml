name: 删除工作区
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开终端，新建多个工作区，鼠标点击工作区X图标
    2. 使用快捷键alt+w
  预期结果:
    1. 删除工作区
    2. 删除工作区
module: 工作区
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653601'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 新建多个工作区'
  action: element_action
  ref: add_tab_button
  do: click
- action: wait
  duration: 0.3
- action: element_action
  ref: add_tab_button
  do: click
- action: wait
  duration: 0.3
- name: '步骤2: 使用快捷键Ctrl+Shift+W删除当前工作区'
  action: keyboard_press
  value: ctrl,shift,w
- action: wait
  duration: 0.3
- name: '步骤3: 右键关闭工作区（关闭最后一个工作区则退出）'
  action: context_menu_comb
  ref: context_close_workspace
- action: wait
  duration: 0.3
- name: '步骤3: 点击确定按钮退出'
  action: element_action
  ref: exit_confirm
  do: click
- action: wait
  duration: 0.3
- name: '步骤3: 验证终端已退出'
  action: wait
  assert:
  - type: process_not_running
  app: terminal
teardown:
- action: session_stop
