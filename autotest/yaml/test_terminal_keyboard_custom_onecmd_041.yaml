# 键盘交互：有一个自定义命令
# Keyboard interaction: one custom command exists
# Tab to custom command plugin, Tab to switch focus to add button

name: "键盘交互-有一个自定义命令"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "Tab键切换到主菜单"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "Space键打开主菜单"
    action: keyboard_press
    key: "Space"
    wait: 0.3

  - name: "通过主菜单打开自定义命令"
    action: main_menu_comb
    ref: menu_custom_commands
    wait: 0.3

  - name: "验证自定义命令列表显示"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "Tab键切换到自定义命令项"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "再次Tab键切换到添加命令按钮"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "Shift+Tab反向切换到自定义命令"
    action: keyboard_hot_key
    keys: "Shift,Tab"
    wait: 0.3

  - name: "Escape关闭列表"
    action: keyboard_press
    key: "Escape"
    wait: 0.3

  - name: "验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
