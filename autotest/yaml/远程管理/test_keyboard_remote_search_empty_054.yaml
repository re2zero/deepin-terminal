name: 键盘交互-远程搜索为空
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开终端，Tab键切换到远程管理插件
    2. 搜索框不输入任何字符，按Enter键
    3. 输入字符，按Enter键搜索结果为空
  （PS：测试时需要测试Shift+Tab反向切换）
  预期结果:
    1. 焦点在搜索框
    2. 搜索框无变化
    3. < 键有Focus效果，按“←”方向键/Enter/Space键返回到搜索框
module: 键盘交互
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653519'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 打开远程管理插件'
  action: main_menu_comb
  ref: menu_remote_management
- action: wait
  duration: 0.3
- name: '步骤2: 搜索框不输入字符，按Enter键'
  action: keyboard_press
  key: Return
- action: wait
  duration: 0.3
- name: '步骤3: 输入搜索字符后按Enter，搜索无结果'
  action: element_action
  ref: remote_search_box
  do: click
- action: wait
  duration: 0.3
- action: keyboard_type
  value: zxcvbnm_nonexistent
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Return
- action: wait
  duration: 0.3
- name: '步骤3: 按←方向键返回到搜索框'
  action: keyboard_press
  key: Left
- action: wait
  duration: 0.3
- name: Shift+Tab反向切换测试
  action: keyboard_press
  value: shift,Tab
- action: wait
  duration: 0.3
- name: 验证终端进程仍在运行
  action: wait
  value: '1000'
teardown:
- action: session_stop
