name: 远程管理-分组输入
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开终端，右键菜单选择远程管理
    2. 按空白处
  预期结果:
    1. 右侧显示出远程管理添加页面
    2. 远程管理页面隐藏
module: 右键菜单工作区
feature: ''
tags:
- L1
vars:
  XLSX_ID: '1653199'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 打开远程管理插件，添加服务器'
  action: main_menu_comb
  ref: menu_remote_management
- action: wait
  duration: 0.3
- name: Tab键切换到添加服务器按钮，按Enter
  action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Return
- action: wait
  duration: 0.3
- name: '步骤1: Tab导航到高级选项，展开高级选项'
  action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Return
- action: wait
  duration: 0.3
- name: Tab导航到分组输入框
  action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- name: '步骤2: 输入中文文本测试'
  action: keyboard_type
  value: 阿里快圣诞节
- action: wait
  duration: 0.3
- name: 清除已有输入，输入英文文本测试
  action: keyboard_press
  value: ctrl,a
- action: wait
  duration: 0.2
- action: keyboard_type
  value: asdfkad
- action: wait
  duration: 0.3
- name: 清除已有输入，输入特殊字符测试
  action: keyboard_press
  value: ctrl,a
- action: wait
  duration: 0.2
- action: keyboard_type
  value: adkj!@#
- action: wait
  duration: 0.3
- name: 按ESC关闭添加服务器窗口
  action: keyboard_press
  key: Escape
- action: wait
  duration: 0.3
- name: 验证终端进程仍在运行
  action: wait
  value: '1000'
teardown:
- action: session_stop
