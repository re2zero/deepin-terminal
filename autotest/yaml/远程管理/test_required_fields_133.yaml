name: 必填项
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 在添加服务器界面中只填写服务器名，点击添加按钮，查看软件显示
    2. 在添加服务器界面中只填写地址，点击添加按钮，查看软件显示
    3. 在添加服务器界面中只填写用户名，点击添加按钮，查看软件显示
    4. 在添加服务器界面中只填写服务器名和地址，点击添加按钮，查看软件显示
    5. 在添加服务器界面中只填写服务器名和用户名，点击添加按钮，查看软件显示
    6. 在添加服务器界面中只填写地址和用户名，点击添加按钮，查看软件显示
    7. 在添加服务器界面中填写服务器名、地址和用户名，点击添加按钮，查看软件显示
  预期结果:
    1. 软件不会添加服务器到服务器列表中
    2. 软件不会添加服务器到服务器列表中
    3. 软件不会添加服务器到服务器列表中
    4. 软件不会添加服务器到服务器列表中
    5. 软件不会添加服务器到服务器列表中
    6. 软件不会添加服务器到服务器列表中
    7. 添加服务器成功，并自动保存到服务器列表中
module: 远程管理器
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653123'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: 主菜单打开远程管理
  action: main_menu_comb
  ref: menu_remote_management
  wait: 0.3
- name: '步骤1: 只填写服务器名，点击添加'
  action: element_action
  ref: add_server_button
  do: click
  wait: 0.3
- action: element_action
  ref: remote_server_name
  do: click
  wait: 0.3
- action: keyboard_type
  value: server-only-name
  wait: 0.3
- action: element_action
  ref: remote_add
  do: click
  wait: 0.3
- name: '步骤2: 只填写地址，点击添加'
  action: element_action
  ref: add_server_button
  do: click
  wait: 0.3
- action: element_action
  ref: remote_server_address
  do: click
  wait: 0.3
- action: keyboard_type
  value: 127.0.0.1
  wait: 0.3
- action: element_action
  ref: remote_add
  do: click
  wait: 0.3
- name: '步骤3: 只填写用户名，点击添加'
  action: element_action
  ref: add_server_button
  do: click
  wait: 0.3
- action: element_action
  ref: remote_username
  do: click
  wait: 0.3
- action: keyboard_type
  value: testuser
  wait: 0.3
- action: element_action
  ref: remote_add
  do: click
  wait: 0.3
- name: '步骤4: 只填写服务器名和地址，点击添加'
  action: element_action
  ref: add_server_button
  do: click
  wait: 0.3
- action: element_action
  ref: remote_server_name
  do: click
  wait: 0.3
- action: keyboard_type
  value: server-name-addr
  wait: 0.3
- action: element_action
  ref: remote_server_address
  do: click
  wait: 0.3
- action: keyboard_type
  value: 127.0.0.1
  wait: 0.3
- action: element_action
  ref: remote_add
  do: click
  wait: 0.3
- name: '步骤5: 只填写服务器名和用户名，点击添加'
  action: element_action
  ref: add_server_button
  do: click
  wait: 0.3
- action: element_action
  ref: remote_server_name
  do: click
  wait: 0.3
- action: keyboard_type
  value: server-name-user
  wait: 0.3
- action: element_action
  ref: remote_username
  do: click
  wait: 0.3
- action: keyboard_type
  value: testuser
  wait: 0.3
- action: element_action
  ref: remote_add
  do: click
  wait: 0.3
- name: '步骤6: 只填写地址和用户名，点击添加'
  action: element_action
  ref: add_server_button
  do: click
  wait: 0.3
- action: element_action
  ref: remote_server_address
  do: click
  wait: 0.3
- action: keyboard_type
  value: 127.0.0.1
  wait: 0.3
- action: element_action
  ref: remote_username
  do: click
  wait: 0.3
- action: keyboard_type
  value: testuser
  wait: 0.3
- action: element_action
  ref: remote_add
  do: click
  wait: 0.3
- name: '步骤7: 填写服务器名、地址和用户名，点击添加'
  action: element_action
  ref: add_server_button
  do: click
  wait: 0.3
- action: element_action
  ref: remote_server_name
  do: click
  wait: 0.3
- action: keyboard_type
  value: server-full-valid
  wait: 0.3
- action: element_action
  ref: remote_server_address
  do: click
  wait: 0.3
- action: keyboard_type
  value: 127.0.0.1
  wait: 0.3
- action: element_action
  ref: remote_username
  do: click
  wait: 0.3
- action: keyboard_type
  value: testuser
  wait: 0.3
- action: element_action
  ref: remote_add
  do: click
  wait: 0.3
- name: '步骤7: 验证服务器成功添加到列表'
  action: wait
  assert:
  - type: element_visible
  selector: null
  role: list
- name: 验证终端进程仍在运行
  action: wait
  value: '1000'
teardown:
- action: session_stop
