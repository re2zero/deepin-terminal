- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Return
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Escape
- action: wait
  duration: 0.3
- name: '步骤5: 重新打开添加服务器，输入中文到服务器名'
  action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Return
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
