name: 远程管理-服务器名称
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 在弹出添加服务器窗口后，直接点击取消按钮，查看软件显示
    2. 再弹出添加服务器窗口后，直接点击添加按钮，查看软件显示
    3. 在弹出添加服务器窗口后，点击右上角的&times;按钮，查看软件显示
    4. 在弹出添加服务器窗口后，按ESC键，查看软件显示
    5. 在添加服务器窗口的服务器名输入框中输入：阿里快圣诞节，查看软件显示
    6. 在添加服务器窗口的服务器名输入框中输入：asdfkad，查看软件显示
    7. 在添加服务器窗口的服务器名输入框中输入：adkj!@#，查看软件显示
    8. 在添加服务器窗口的服务器名输入框中输入：超长字符，查看软件显示
    9. 在添加服务器窗口的服务器名输入框中输入：特殊字符，查看软件显示
  预期结果:
    1. 添加服务器窗口会自动退出
    2. 添加服务器窗口会自动退出
    3. 添加服务器窗口会自动退出
    4. 添加服务器窗口会自动退出
    5. 可以正常输入，并显示正确
    6. 可以正常输入，并显示正确
    7. 可以正常输入，并显示正确
    8. 可以正常输入，超过窗口宽度在服务器列表中以....显示
    9. 可以正常输入，并显示正确
module: 远程管理器
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653095'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 打开远程管理插件，添加服务器'
  action: main_menu_comb
  ref: menu_remote_management
- action: wait
  duration: 0.3
- name: Tab键切换到添加服务器按钮，按Enter
  action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Return
- action: wait
  duration: 0.3
- name: '步骤1: Tab到取消按钮，按Enter关闭窗口'
  action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Return
- action: wait
  duration: 0.3
- name: '步骤2: 重新打开添加服务器，直接点添加按钮'
  action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Return
- action: wait
  duration: 0.3
- name: Tab到添加按钮，按Enter关闭窗口
  action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
  key: Tab
- action: wait
  duration: 0.3
- action: keyboard_press
