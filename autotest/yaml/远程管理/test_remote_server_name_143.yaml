- action: wait
  duration: 0.3
- name: 按ESC关闭添加服务器窗口
  action: keyboard_press
  key: Escape
- action: wait
  duration: 0.3
- name: 验证终端进程仍在运行
  action: wait
  value: '1000'
teardown:
- action: session_stop
