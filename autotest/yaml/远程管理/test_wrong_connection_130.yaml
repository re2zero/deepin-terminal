name: 错误连接
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 在添加服务器界面中填写错误的地址，然后连接服务器
    2. 在添加服务器界面中填写错误的用户名，然后连接服务器
    3. 在添加服务器界面中填写错误的端口，然后连接服务器
    4. 在添加服务器界面中填写错误的端口和地址，然后连接服务器
    5. 在添加服务器界面中填写错误的端口和用户名，然后连接服务器
    6. 在添加服务器界面中填写错误的端口、地址和用户名，然后连接服务器
    7. 在添加服务器界面中填写错误的路径，然后连接服务器
    8. 在添加服务器界面中填写错误的命令，然后连接服务器
    9. 在服务器没有安装ssh服务时，填写正确的数据，并连接服务器
  预期结果:
    1. 连接服务器会失败
    2. 连接服务器会失败
    3. 连接服务器会失败
    4. 连接服务器会失败
    5. 连接服务器会失败
    6. 连接服务器会失败
    7. 连接服务器会失败
    8. 连接服务器会失败
    9. 连接服务器会失败
module: 远程管理器
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653131'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: 主菜单打开远程管理
  action: main_menu_comb
  ref: menu_remote_management
  wait: 0.3
- name: '步骤1: 填写错误地址并尝试连接'
  action: element_action
  ref: add_server_button
  do: click
  wait: 0.3
- action: element_action
  ref: remote_server_name
  do: click
  wait: 0.3
- action: keyboard_type
  value: wrong-addr
  wait: 0.3
- action: element_action
  ref: remote_server_address
  do: click
  wait: 0.3
- action: keyboard_type
  value: 999.999.999.999
  wait: 0.3
- action: element_action
  ref: remote_add
  do: click
  wait: 0.3
- name: '步骤2: 填写错误用户名并尝试连接'
  action: element_action
  ref: add_server_button
  do: click
  wait: 0.3
- action: element_action
  ref: remote_server_name
  do: click
  wait: 0.3
- action: keyboard_type
  value: wrong-user
  wait: 0.3
- action: element_action
  ref: remote_server_address
  do: click
  wait: 0.3
- action: keyboard_type
  value: 127.0.0.1
  wait: 0.3
- action: element_action
  ref: remote_username
  do: click
  wait: 0.3
- action: keyboard_type
  value: nonexistent_user
  wait: 0.3
- action: element_action
  ref: remote_add
  do: click
  wait: 0.3
- name: '步骤3: 填写错误端口并尝试连接'
  action: element_action
  ref: add_server_button
  do: click
  wait: 0.3
- action: element_action
  ref: remote_server_name
  do: click
  wait: 0.3
- action: keyboard_type
  value: wrong-port
  wait: 0.3
- action: element_action
  ref: remote_server_address
  do: click
  wait: 0.3
- action: keyboard_type
  value: 127.0.0.1
  wait: 0.3
- action: element_action
  ref: remote_server_port
  do: click
  wait: 0.3
- action: keyboard_type
  value: '65536'
  wait: 0.3
- action: element_action
  ref: remote_add
  do: click
  wait: 0.3
- name: '步骤4: 填写错误端口和地址并尝试连接'
  action: element_action
  ref: add_server_button
  do: click
  wait: 0.3
- action: element_action
  ref: remote_server_name
  do: click
  wait: 0.3
- action: keyboard_type
  value: wrong-port-addr
  wait: 0.3
- action: element_action
  ref: remote_server_address
  do: click
  wait: 0.3
- action: keyboard_type
  value: 999.999.999.999
  wait: 0.3
- action: element_action
  ref: remote_server_port
  do: click
  wait: 0.3
- action: keyboard_type
  value: '65536'
  wait: 0.3
- action: element_action
  ref: remote_add
  do: click
  wait: 0.3
- name: '步骤5: 填写错误端口和用户名并尝试连接'
  action: element_action
  ref: add_server_button
  do: click
  wait: 0.3
- action: element_action
  ref: remote_server_name
  do: click
  wait: 0.3
- action: keyboard_type
  value: wrong-port-user
  wait: 0.3
- action: element_action
  ref: remote_server_address
  do: click
  wait: 0.3
- action: keyboard_type
  value: 127.0.0.1
  wait: 0.3
- action: element_action
  ref: remote_server_port
  do: click
  wait: 0.3
- action: keyboard_type
  value: '65536'
  wait: 0.3
- action: element_action
  ref: remote_username
  do: click
  wait: 0.3
- action: keyboard_type
  value: nonexistent_user
  wait: 0.3
- action: element_action
  ref: remote_add
  do: click
  wait: 0.3
- name: '步骤6: 填写错误的端口、地址和用户名并尝试连接'
  action: element_action
  ref: add_server_button
  do: click
  wait: 0.3
- action: element_action
  ref: remote_server_name
  do: click
  wait: 0.3
- action: keyboard_type
  value: wrong-all
  wait: 0.3
- action: element_action
  ref: remote_server_address
  do: click
  wait: 0.3
- action: keyboard_type
  value: 999.999.999.999
  wait: 0.3
- action: element_action
  ref: remote_server_port
  do: click
  wait: 0.3
- action: keyboard_type
  value: '65536'
  wait: 0.3
- action: element_action
  ref: remote_username
  do: click
  wait: 0.3
- action: keyboard_type
  value: nonexistent_user
  wait: 0.3
- action: element_action
  ref: remote_add
  do: click
  wait: 0.3
- name: '步骤7-8: 添加错误路径和命令的服务器'
  action: element_action
  ref: add_server_button
  do: click
  wait: 0.3
- action: element_action
  ref: remote_server_name
  do: click
  wait: 0.3
- action: keyboard_type
  value: wrong-path-cmd
  wait: 0.3
- action: element_action
  ref: remote_server_address
  do: click
  wait: 0.3
- action: keyboard_type
  value: 127.0.0.1
  wait: 0.3
- action: element_action
  ref: remote_add
  do: click
  wait: 0.3
- name: '步骤9: 添加未安装ssh服务的服务器尝试连接'
  action: element_action
  ref: add_server_button
  do: click
  wait: 0.3
- action: element_action
  ref: remote_server_name
  do: click
  wait: 0.3
- action: keyboard_type
  value: no-ssh-service
  wait: 0.3
- action: element_action
  ref: remote_server_address
  do: click
  wait: 0.3
- action: keyboard_type
  value: 127.0.0.1
  wait: 0.3
- action: element_action
  ref: remote_server_port
  do: click
  wait: 0.3
- action: keyboard_type
  value: '2222'
  wait: 0.3
- action: element_action
  ref: remote_username
  do: click
  wait: 0.3
- action: keyboard_type
  value: testuser
  wait: 0.3
- action: element_action
  ref: remote_add
  do: click
  wait: 0.3
- name: 验证终端进程仍在运行
  action: wait
  value: '1000'
teardown:
- action: session_stop
