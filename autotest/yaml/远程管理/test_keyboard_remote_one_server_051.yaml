name: 键盘交互远程管理列表有一个服务器（分组或未分组）
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开终端，Tab键切换到远程管理插件
    2. 再按Tab键
  （PS：测试时需要测试Shift+Tab反向切换）
  预期结果:
    1. 焦点进入服务器选项，列表有Focus效果
    2. 添加服务器按钮高亮
module: 键盘交互
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653525'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: 打开远程管理插件
  action: main_menu_comb
  ref: main_menu_button
  assert:
  - type: element_visible
  selector: null
  role: list
  items:
  - 远程管理
- name: 验证远程管理列表可见
  action: wait
  assert:
  - type: element_visible
  selector: null
  role: list
- name: 按Tab键焦点进入服务器选项（列表有Focus效果）
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: 验证添加服务器按钮可见（高亮）
  action: wait
  assert:
  - type: element_visible
  selector: null
  role: button
- name: 再按Tab切换焦点到添加服务器按钮
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: 再按Tab键（添加服务器按钮高亮）
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: 按Shift+Tab反向切换焦点
  action: keyboard_press
  value: Shift,Tab
  wait: 0.3
- name: 按ESC返回终端
  action: keyboard_press
  key: Escape
  wait: 0.3
- name: 验证终端进程仍在运行
  action: wait
  value: '1000'
teardown:
- action: session_stop
