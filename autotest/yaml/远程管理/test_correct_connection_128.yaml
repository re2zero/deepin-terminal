name: 正确连接
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 在添加服务器界面填写正确的地址、端口、用户名，然后连接服务器
    2. 在服务器列表中添加相同的服务器，查看服务器列表显示
    3. 在服务器列表中添加服务器名称不同，但地址、用户名、端口都一样，查看服务器列表显示
  预期结果:
    1. 可以连接成功
    2. 界面提示“该服务器名已存在,请重新输入”
    3. 显示名称不同的服务器名称
module: 远程管理器
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653135'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 主菜单打开远程管理'
  action: main_menu_comb
  ref: menu_remote_management
  wait: 0.3
- name: '步骤1: 点击添加服务器按钮'
  action: element_action
  ref: add_server_button
  do: click
  wait: 0.3
- name: '步骤1: 填写服务器名'
  action: element_action
  ref: remote_server_name
  do: click
  wait: 0.3
- action: keyboard_type
  value: server-correct-01
  wait: 0.3
- name: '步骤1: 填写地址'
  action: element_action
  ref: remote_server_address
  do: click
  wait: 0.3
- action: keyboard_type
  value: 127.0.0.1
  wait: 0.3
- name: '步骤1: 填写端口'
  action: element_action
  ref: remote_server_port
  do: click
  wait: 0.3
- action: keyboard_type
  value: '22'
  wait: 0.3
- name: '步骤1: 填写用户名'
  action: element_action
  ref: remote_username
  do: click
  wait: 0.3
- action: keyboard_type
  value: testuser
  wait: 0.3
- name: '步骤1: 点击添加按钮'
  action: element_action
  ref: remote_add
  do: click
  wait: 0.3
- name: '步骤1: 验证服务器添加成功，列表中存在'
  action: wait
  assert:
  - type: element_visible
  selector: null
  role: list
- name: '步骤2: 再次添加相同名称的服务器'
  action: element_action
  ref: add_server_button
  do: click
  wait: 0.3
- action: element_action
  ref: remote_server_name
  do: click
  wait: 0.3
- action: keyboard_type
  value: server-correct-01
  wait: 0.3
- action: element_action
  ref: remote_server_address
  do: click
  wait: 0.3
- action: keyboard_type
  value: 127.0.0.1
  wait: 0.3
- action: element_action
  ref: remote_server_port
  do: click
  wait: 0.3
- action: keyboard_type
  value: '22'
  wait: 0.3
- action: element_action
  ref: remote_username
  do: click
  wait: 0.3
- action: keyboard_type
  value: testuser
  wait: 0.3
- name: '步骤2: 点击添加，验证重复名称提示'
  action: element_action
  ref: remote_add
  do: click
  wait: 0.3
- name: '步骤3: 添加服务器名称不同但地址端口用户名相同'
  action: element_action
  ref: add_server_button
  do: click
  wait: 0.3
- action: element_action
  ref: remote_server_name
  do: click
  wait: 0.3
- action: keyboard_type
  value: server-correct-02
  wait: 0.3
- action: element_action
  ref: remote_server_address
  do: click
  wait: 0.3
- action: keyboard_type
  value: 127.0.0.1
  wait: 0.3
- action: element_action
  ref: remote_server_port
  do: click
  wait: 0.3
- action: keyboard_type
  value: '22'
  wait: 0.3
- action: element_action
  ref: remote_username
  do: click
  wait: 0.3
- action: keyboard_type
  value: testuser
  wait: 0.3
- name: '步骤3: 点击添加，验证不同名称可添加成功'
  action: element_action
  ref: remote_add
  do: click
  wait: 0.3
- name: 验证服务器列表中存在两个不同名称的服务器
  action: wait
  assert:
  - type: element_visible
  selector: null
  role: list
- name: 验证终端进程仍在运行
  action: wait
  value: '1000'
teardown:
- action: session_stop
