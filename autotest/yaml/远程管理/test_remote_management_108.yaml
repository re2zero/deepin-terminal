name: 远程管理
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开终端，Tab键切换到主菜单，按Enter键
    2. “↑”、“↓”方向键/Tab键切换远程管理
    3. 按Enter键
  （PS：测试时需要测试Shift+Tab反向切换）
  预期结果:
    1. 显示主菜单列表
    2. 远程管理插件打开
    3. 焦点切换到添加服务器按钮
module: 键盘交互
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653527'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 右键菜单选择远程管理'
  action: context_menu_comb
  ref: context_remote_management
- action: wait
  duration: 0.3
- name: '步骤1: 截图-远程管理面板显示'
  action: noop
- name: '步骤1: 验证终端进程运行中'
  action: wait
  value: '1000'
- name: '步骤2: 点击终端内容区域使远程管理页面隐藏'
  action: element_action
  ref: terminal_content
  do: click
- action: wait
  duration: 0.3
- name: '步骤2: 截图-点击后远程管理页面隐藏'
  action: noop
- name: '步骤2: 验证终端进程运行中'
  action: wait
  value: '1000'
teardown:
- action: session_stop
