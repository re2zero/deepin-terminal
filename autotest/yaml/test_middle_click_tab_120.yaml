# YAML test case for terminal - 鼠标中键关闭标签页 (id=120)
# Module: 右键菜单标签页(#116127)
# Priority: 2
name: "鼠标指针在标签页上，点击鼠标中键"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 鼠标指向标签页，点击鼠标中键"
    action: element_action
    ref: tab_list
    do: "middle_click"
  - action: wait
    duration: 0.5

  - name: "步骤2: 新建多个标签页"
    action: element_action
    ref: add_tab_button
    do: "click"
  - action: wait
    duration: 1.0
  - action: element_action
    ref: add_tab_button
    do: "click"
  - action: wait
    duration: 1.0
    assert:
      - type: process_running
        app: "terminal"

  - name: "鼠标中键点击标签页关闭当前标签"
    action: element_action
    ref: tab_list
    do: "middle_click"
  - action: wait
    duration: 2.0
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤3: 先做横向分屏"
    action: context_menu_comb
    ref: context_horizontal_split
  - action: wait
    duration: 1.0
  - name: "再做纵向分屏"
    action: context_menu_comb
    ref: context_vertical_split
  - action: wait
    duration: 1.0
    assert:
      - type: process_running
        app: "terminal"

  - name: "鼠标中键点击分屏窗口标签页"
    action: element_action
    ref: tab_list
    do: "middle_click"
  - action: wait
    duration: 2.0
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
