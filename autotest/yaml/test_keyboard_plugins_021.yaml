name: "键盘交互焦点在插件"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "按Tab键焦点依次经过标签栏和主菜单等"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.5
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.5
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.5

  - name: "按Tab键焦点跳转到插件区域（查找、编码等）"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.5

  - name: "按Shift+Tab反向切换焦点"
    action: keyboard_hot_key
    keys: "shift+tab"
  - action: wait
    duration: 0.5

  - name: "按ESC键焦点返回到终端"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.5

  - name: "验证终端仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
