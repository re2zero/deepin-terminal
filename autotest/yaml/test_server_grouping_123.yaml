# Test case 123: 服务器分组
# Module: 远程管理器(#116129)
# Priority: 2
name: "服务器分组"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 打开远程管理插件"
    action: main_menu_comb
    ref: menu_remote_management
  - action: wait
    duration: 0.3

  - name: "Tab到添加服务器按钮，按Enter打开添加窗口"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.3

  - name: "按ESC关闭添加窗口"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "步骤2: Tab到服务器列表区域"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3

  - name: "按Down键浏览服务器分组列表"
    action: keyboard_press
    key: "Down"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Down"
  - action: wait
    duration: 0.3

  - name: "按Up键浏览服务器分组列表"
    action: keyboard_press
    key: "Up"
  - action: wait
    duration: 0.3

  - name: "步骤3: 按Enter进入分组"
    action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.3

  - name: "按Tab切换到组内服务器"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3

  - name: "按←方向键返回上级"
    action: keyboard_press
    key: "Left"
  - action: wait
    duration: 0.3

  - name: "步骤4: Shift+Tab反向切换测试"
    action: keyboard_hot_key
    keys: "shift,Tab"
  - action: wait
    duration: 0.3

  - name: "按ESC关闭远程管理面板"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
