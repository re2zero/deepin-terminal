# UNSUPPORTED: skip-触摸操作无法自动化
name: '普通窗口标签页拖拽到新窗口 - NON-AUTOMATABLE: skip-触摸操作无法自动化'
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开终端（只有一个标签页），选择标签页按住鼠标左键，拖拽此标签页图标，鼠标位置拖动到标签栏外
    2. 新建2个窗口，如：窗口1(包含至少1个标签A)和窗口2(包含至少1个标签B)，选中窗口2的标签B，按住鼠标左键，拖拽此标签页图标到窗口1的标签栏，释放鼠标左键
    3. 新建一个含有>=2个标签页的窗口，选中其中一个标签(比如标签B)，按住鼠标左键，拖拽此标签页图标，不在其他终端窗口的标签栏上释放鼠标左键
  Notes:测试时一并测试触摸屏、触控板、键盘交互
  预期结果:
    1. 缩略图出现时，窗口消失；释放鼠标左键窗口显示正常
    2. 显示与该位置的插入标签的动画，拖拽的标签页移动到鼠标释放的位置； 窗口2标签B销毁，窗口1包含标签A和标签B
    3. 新建一个终端窗口且该窗口为激活状态
  Notes:标签拖拽后，标签本身绑定的数据格式等信息需要同步
module: 标签页移动
feature: ''
tags:
- L1
vars:
  XLSX_ID: '1652903'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: 跳过 - skip-触摸操作无法自动化
  action: wait
  value: '300'
- name: 验证终端进程运行中
  action: wait
  value: '1000'
teardown:
- action: session_stop
