# YAML test case — 键盘交互自定义功能 (id=042)
# 验证自定义命令插件的键盘导航：Tab切换、方向键导航、Enter执行
name: "键盘交互自定义功能"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "打开自定义命令插件"
    action: main_menu_comb
    ref: main_menu_button
    menu:
      - "自定义命令"
    assert:
      - type: element_visible
        selector:
          role: "list"

  - name: "验证搜索框可见（光标在搜索框）"
    action: wait
    assert:
      - type: element_visible
        selector:
          role: "text"

  - name: "按Tab切换到自定义命令列表"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "验证自定义命令列表有Focus效果"
    action: wait
    assert:
      - type: element_visible
        selector:
          role: "list"

  - name: "按下箭头键切换自定义命令"
    action: keyboard_press
    key: "Down"
    wait: 0.3

  - name: "再按下箭头切换"
    action: keyboard_press
    key: "Down"
    wait: 0.3

  - name: "按上箭头返回上一个命令"
    action: keyboard_press
    key: "Up"
    wait: 0.3

  - name: "按右方向键（聚焦编辑按钮）"
    action: keyboard_press
    key: "Right"
    wait: 0.3

  - name: "按左方向键（返回自定义命令Focus）"
    action: keyboard_press
    key: "Left"
    wait: 0.3

  - name: "按Shift+Tab反向切换焦点"
    action: keyboard_hot_key
    keys: "Shift,Tab"
    wait: 0.3

  - name: "按Tab回到自定义列表"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "按Enter执行选中的自定义命令"
    action: keyboard_press
    key: "Return"
    wait: 1.0

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
