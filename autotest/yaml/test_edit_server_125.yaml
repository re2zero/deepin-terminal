  - name: "按ESC关闭编辑窗口"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "Shift+Tab反向切换测试"
    action: keyboard_hot_key
    keys: "shift,Tab"
  - action: wait
    duration: 0.3

  - name: "按ESC关闭远程管理面板"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
