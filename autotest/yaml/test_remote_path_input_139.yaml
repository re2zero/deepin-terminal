# Test case 139: 路径
# Module: 远程管理器(#116129)
# Priority: 2

name: "远程管理-路径输入"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 打开远程管理插件"
    action: context_menu_comb
    ref: context_remote_management
  - action: wait
    duration: 0.5

  - name: "步骤2: 点击添加服务器按钮"
    action: element_action
    ref: add_server_button
  - action: wait
    duration: 0.5

  - name: "步骤3: 输入服务器名称"
    action: keyboard_type_text
    text: "路径测试服务器"
  - action: wait
    duration: 0.3

  - name: "步骤4: 点击添加按钮保存"
    action: element_action
    ref: remote_add
  - action: wait
    duration: 0.5

  - name: "步骤5: 点击已添加的服务器"
    action: element_action
    selector:
      role: "list item"
      index: 0
  - action: wait
    duration: 0.3

  - name: "步骤6: 按Right+Return打开编辑对话框"
    action: keyboard_press
    key: "Right"
  - action: wait
    duration: 0.2
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.5

  - name: "步骤7: 输入编辑后的服务器名称"
    action: keyboard_type_text
    text: "编辑后路径测试服务器"
  - action: wait
    duration: 0.3

  - name: "步骤8: 点击保存按钮"
    action: element_action
    ref: remote_save
  - action: wait
    duration: 0.5

  - name: "步骤9: 按ESC关闭远程管理窗口"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
