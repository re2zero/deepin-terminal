name: 恢复默认设置按钮
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开设置界面，检查页面最下方显示
    2. 不做任何修改，点击恢复所有按钮
    3. 修改任意参数，点击恢复按钮
  预期结果:
    1. 显示恢复所有设置按钮
    2. 可以点击，界面保持不变
    3. 被修改的数据恢复默认，检查对应配置文件也生效
module: 设置界面高级设置
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653305'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 通过主菜单打开设置'
  action: main_menu_comb
  ref: menu_settings
  wait: 0.3
- name: '步骤2: 点击高级设置导航项'
  action: element_action
  ref: settings_advanced
  do: click
  wait: 0.3
- name: '步骤3: 多次Tab键将焦点移到恢复所有设置按钮'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤4: 继续Tab直到焦点到恢复默认按钮'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤5: 继续Tab键'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤6: 继续Tab键'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤7: 继续Tab键'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤8: 继续Tab键直到目标按钮'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤9: 继续Tab键'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤10: Enter键触发恢复所有设置（不做修改时界面不变）'
  action: keyboard_press
  key: Enter
  wait: 0.3
- name: '步骤11: Shift+Tab反向切换焦点验证'
  action: keyboard_press
  value: Shift,Tab
  wait: 0.3
- name: '步骤12: ESC关闭设置窗口'
  action: keyboard_press
  key: Escape
  wait: 0.3
- name: 验证终端进程运行中
  action: wait
  value: '1000'
teardown:
- action: session_stop
