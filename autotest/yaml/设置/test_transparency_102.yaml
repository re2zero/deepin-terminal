name: 透明度
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 进入设置，Tab键切换到透明度
    2. 键盘按“←”、“→”“↑”、“↓“方向键
  （PS：测试时需要测试Shift+Tab反向切换）
  预期结果:
    1. 透明度按钮有Focus效果
    2. 可调节透明度
module: 键盘交互
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653577'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 打开主菜单-设置'
  action: main_menu_comb
  ref: menu_settings
- action: wait
  duration: 0.3
- name: '步骤1: 验证设置弹窗显示'
  action: wait
  value: '1000'
- name: '步骤1: 截图-设置窗口'
  action: noop
- name: '步骤1: 点击基础设置-界面'
  action: element_action
  ref: settings_basic
  do: click
- action: wait
  duration: 0.3
- name: '步骤1: 截图-界面设置页'
  action: noop
- name: '步骤1: 验证终端进程运行中'
  action: wait
  value: '1000'
- name: '步骤2: 关闭设置窗口'
  action: element_action
  ref: settings_close_button
  do: click
- action: wait
  duration: 0.3
- name: 验证终端进程运行中
  action: wait
  value: '1000'
teardown:
- action: session_stop
