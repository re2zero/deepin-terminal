# Test case 179: [007]最大化还原
# Module: 主界面右上角菜单栏(#116141)
# Priority: 1

name: "最大化还原"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 点击最大化按钮"
    action: element_action
    ref: maximize_button
    do: "click"
    wait: 0.3

  - name: "步骤2: 点击还原按钮"
    action: element_action
    ref: maximize_button
    do: "click"
    wait: 0.3

  - name: "步骤3: 验证窗口按钮均可见"
    action: wait
    assert:
      - type: element_visible
        ref: minimize_button
      - type: element_visible
        ref: maximize_button
      - type: element_visible
        ref: close_button

  - name: "验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
