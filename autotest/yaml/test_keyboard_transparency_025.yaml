# Test case 025: 键盘交互焦点在光标在透明度
# Module: 键盘交互(#116109)
# Priority: 2

name: "键盘交互-透明度调节"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 打开设置界面"
    action: main_menu_comb
    ref: menu_settings

  - name: "步骤2: Tab键切换到透明度设置区域"
    action: keyboard_press
    key: "Tab"
  - action: keyboard_press
    key: "Tab"
  - action: keyboard_press
    key: "Tab"

  - name: "步骤3: 按→方向键调节透明度增大"
    action: keyboard_press
    key: "Right"

  - name: "步骤4: 按←方向键调节透明度减小"
    action: keyboard_press
    key: "Left"

  - name: "步骤5: 按↑方向键调节透明度增大"
    action: keyboard_press
    key: "Up"

  - name: "步骤6: 按↓方向键调节透明度减小"
    action: keyboard_press
    key: "Down"

  - name: "步骤7: 验证设置对话框仍可见"
    action: wait
    assert:
      - type: element_visible
        selector:
          role: "dialog"

  - name: "步骤8: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
