# Test case 129: 连接服务器后操作
# Module: 远程管理器(#116129)
# Priority: 2
# Steps:
#   1. 打开终端进入远程管理服务器，选择一个远程服务器
#   2. 当前窗口有程序运行，选择一个服务器连接
#   3. 当前窗口没有程序运行，选择一个服务器连接
#   4. 在远程服务器中使用rz和sz命令做上传文件和下载文件操作
# Expected:
#   1. 会自动连接上服务器
#   2. 在新标签中连接远程服务器
#   3. 在当前窗口中连接远程服务器
#   4. 如果远程服务器没有这命令自动打印一段提示信息

name: "连接服务器后操作"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 验证主窗口可见"
    action: element_action
    ref: main_frame
    do: "click"
    assert:
      - type: element_visible
        selector:
          role: "frame"

  - name: "步骤1: 主菜单打开远程管理面板"
    action: main_menu_comb
    ref: menu_remote_management
    wait: 1.0

  - name: "步骤1: 选择远程管理列表中的服务器"
    action: element_action
    ref: remote_server_list
    do: "click"
    wait: 0.5

  - name: "步骤1: 连接服务器自动连接"
    action: keyboard_press
    key: "Return"
    wait: 1.0

  - name: "步骤2: 当前窗口有程序运行，连接服务器在新标签中打开"
    action: keyboard_hot_key
    keys: "ctrl+shift+t"
    wait: 0.5

  - name: "步骤2: 在新标签中选择远程服务器连接"
    action: main_menu_comb
    ref: menu_remote_management
    wait: 1.0
  - action: element_action
    ref: remote_server_list
    do: "click"
    wait: 0.5
  - action: keyboard_press
    key: "Return"
    wait: 1.0

  - name: "步骤3: 当前窗口没有程序运行，连接服务器在当前窗口中"
    action: keyboard_hot_key
    keys: "ctrl+shift+t"
    wait: 0.5

  - name: "步骤3: 在当前标签中选择远程服务器连接"
    action: main_menu_comb
    ref: menu_remote_management
    wait: 1.0
  - action: element_action
    ref: remote_server_list
    do: "click"
    wait: 0.5
  - action: keyboard_press
    key: "Return"
    wait: 1.0

  - name: "步骤4: 在远程服务器中使用rz命令测试上传文件"
    action: keyboard_type
    text: "rz"
    wait: 0.3
  - action: keyboard_press
    key: "Return"
    wait: 1.0

  - name: "步骤4: 在远程服务器中使用sz命令测试下载文件"
    action: keyboard_type
    text: "sz /tmp/test.txt"
    wait: 0.3
  - action: keyboard_press
    key: "Return"
    wait: 1.0

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
