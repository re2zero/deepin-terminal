# Test case 121: 服务器窗口
# Module: 远程管理器(#116129)
# Priority: 2
name: "服务器窗口"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 终端右键查看是否有远程管理菜单显示"
    action: context_menu_comb
    ref: context_remote_management
  - action: wait
    duration: 0.5
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤2: 右键菜单点击远程管理，查看弹出窗口"
    action: context_menu_comb
    ref: context_remote_management
  - action: wait
    duration: 1.0

  - name: "按ESC关闭远程管理面板"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.5

  - name: "步骤3: 主菜单-远程管理"
    action: main_menu_comb
    ref: menu_remote_management
  - action: wait
    duration: 1.0

  - name: "按ESC关闭远程管理面板"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.5

  - name: "步骤4: 打开远程管理后，点击添加服务器按钮"
    action: main_menu_comb
    ref: menu_remote_management
  - action: wait
    duration: 1.0
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.5

  - name: "步骤5: Alt+Del快捷键调出远程管理窗口"
    action: keyboard_hot_key
    keys: "alt+Delete"
  - action: wait
    duration: 0.5
  - name: "再次Alt+Del关闭远程管理窗口"
    action: keyboard_hot_key
    keys: "alt+Delete"
  - action: wait
    duration: 0.5

  - name: "步骤6: 弹出添加服务器窗口后，点击取消按钮"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.5

  - name: "步骤7: 添加服务器窗口按ESC键关闭"
    action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.5
  - name: "再次Tab到添加按钮并按Enter"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.5
  - name: "按ESC键关闭添加窗口"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.5

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
