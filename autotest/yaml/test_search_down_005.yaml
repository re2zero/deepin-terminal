# YAML test case for terminal - 向下查找
name: "向下查找"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "验证主窗口可见"
    action: element_action
    ref: main_frame
    do: "click"
    assert:
      - type: element_visible
        selector:
          role: "frame"

  - name: "输入多行内容到终端"
    action: keyboard_type
    text: "echo item_a"
    wait: 0.3

  - name: "回车"
    action: keyboard_press
    key: "Return"
    wait: 0.3

  - name: "输入第二行"
    action: keyboard_type
    text: "echo item_b"
    wait: 0.3

  - name: "回车"
    action: keyboard_press
    key: "Return"
    wait: 0.3

  - name: "输入第三行"
    action: keyboard_type
    text: "echo item_c"
    wait: 0.3

  - name: "回车"
    action: keyboard_press
    key: "Return"
    wait: 0.5

  - name: "打开搜索框"
    action: keyboard_hot_key
    keys: "ctrl+alt+f"
    wait: 1.0

  - name: "输入搜索关键词"
    action: element_set_value
    ref: search_input
    value: "item"
    wait: 0.5

  - name: "回车开始搜索，默认从上往下"
    action: keyboard_press
    key: "Return"
    wait: 1.0

  - name: "截图-第一次回车搜索"
    action: screenshot
    desc: "默认从上往下搜索，选中第一个匹配项"

  - name: "再次回车继续向下搜索"
    action: keyboard_press
    key: "Return"
    wait: 1.0

  - name: "截图-第二次回车搜索"
    action: screenshot
    desc: "每次回车向下检索下一个匹配项"

  - name: "再次回车继续向下搜索"
    action: keyboard_press
    key: "Return"
    wait: 1.0

  - name: "截图-第三次回车搜索"
    action: screenshot
    desc: "继续向下检索并选中下一个匹配项"

  - name: "验证进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
