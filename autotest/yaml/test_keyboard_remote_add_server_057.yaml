# Test case 057: 键盘交互添加服务器
# Module: 键盘交互(#116109)
# Priority: 2

name: "键盘交互-添加服务器"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 打开远程管理插件"
    action: main_menu_comb
    ref: menu_remote_management
  - action: wait
    duration: 0.5

  - name: "步骤2: 点击添加服务器按钮打开对话框"
    action: element_action
    ref: add_server_button
  - action: wait
    duration: 0.5

  - name: "步骤3: 输入服务器名称"
    action: keyboard_type_text
    text: "测试服务器"
  - action: wait
    duration: 0.3

  - name: "步骤4: 点击添加按钮"
    action: element_action
    ref: remote_add
  - action: wait
    duration: 0.5

  - name: "步骤5: 关闭远程管理面板"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
