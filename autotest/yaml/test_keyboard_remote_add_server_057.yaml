# Test case 057: 键盘交互添加服务器
# Module: 键盘交互(#116109)
# Priority: 2

name: "键盘交互-添加服务器"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 打开远程管理插件"
    action: main_menu_comb
    ref: menu_remote_management
  - action: wait
    duration: 0.3

  - name: "步骤1: Tab到添加服务器按钮，按Enter键"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.3

  - name: "步骤2: 依次按Tab键切换服务器名字段"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3

  - name: "步骤2: Tab键切换到地址字段"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3

  - name: "步骤2: Tab键切换到端口字段"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3

  - name: "步骤2: Tab键切换到用户名字段"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3

  - name: "步骤2: Tab键切换到密码字段"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3

  - name: "步骤3: 继续Tab到取消按钮，按Enter键"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.3

  - name: "步骤4: 重新打开添加服务器弹框，按ESC键退出"
    action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "Shift+Tab反向切换测试"
    action: keyboard_hot_key
    keys: "shift,Tab"
  - action: wait
    duration: 0.3

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
