# YAML test case for terminal - 背景模糊
name: "背景模糊"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:

  - name: "右键打开设置对话框"
    action: context_menu_comb
    ref: context_settings
    wait: 0.3
    assert:
      - type: element_visible
        selector:
          role: "dialog"

  - name: "截图-设置对话框打开"
    action: screenshot
    desc: "设置对话框打开状态"

  - name: "点击高级设置导航项"
    action: element_action
    ref: settings_advanced
    do: "click"
    wait: 0.3

  - name: "截图-高级设置页面"
    action: screenshot
    desc: "高级设置页面，检查背景模糊默认值"

  - name: "验证进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "关闭设置对话框"
    action: element_action
    ref: settings_close_button
    do: "click"
    wait: 0.3

  - name: "验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
