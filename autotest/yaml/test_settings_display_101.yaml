name: "设置界面显示"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0
  - name: "验证终端进程运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

steps:
  - name: "右键打开设置"
    action: context_menu_comb
    ref: context_settings
    wait_for:
      selector:
        role: "dialog"
      timeout: 5000
    assert:
      - type: element_visible
        selector:
          role: "dialog"

  - name: "验证基础设置导航项存在"
    action: element_action
    ref: settings_basic
    do: "click"
    wait: 0.3

  - name: "点击界面设置"
    action: element_action
    ref: settings_interface
    do: "click"
    wait: 0.3

  - name: "点击快捷键"
    action: element_action
    ref: settings_shortcuts
    do: "click"
    wait: 0.3

  - name: "点击终端快捷键"
    action: element_action
    ref: settings_terminal_shortcuts
    do: "click"
    wait: 0.3

  - name: "点击标签页快捷键"
    action: element_action
    ref: settings_tab_shortcuts
    do: "click"
    wait: 0.3

  - name: "点击其他快捷键"
    action: element_action
    ref: settings_other_shortcuts
    do: "click"
    wait: 0.3

  - name: "点击高级设置"
    action: element_action
    ref: settings_advanced
    do: "click"
    wait: 0.3

  - name: "点击光标设置"
    action: element_action
    ref: settings_cursor
    do: "click"
    wait: 0.3

  - name: "点击滚动设置"
    action: element_action
    ref: settings_scroll
    do: "click"
    wait: 0.3

  - name: "点击窗口设置"
    action: element_action
    ref: settings_window
    do: "click"
    wait: 0.3

  - name: "验证设置对话框仍然打开"
    action: wait
    assert:
      - type: element_visible
        selector:
          role: "dialog"

  - name: "关闭设置"
    action: element_action
    ref: settings_close_button
    do: "click"
    wait: 0.3

  - name: "验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
