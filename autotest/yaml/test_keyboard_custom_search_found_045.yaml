# YAML test case — 键盘交互自定义命令搜索有结果 (id=045)
# 验证搜索有结果后的键盘导航：Tab切换、方向键、Enter执行、ESC返回
name: "键盘交互自定义命令搜索有结果"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "打开自定义命令插件"
    action: main_menu_comb
    ref: main_menu_button
    menu:
      - "自定义命令"
    assert:
      - type: element_visible
        selector:
          role: "list"

  - name: "验证搜索框有Focus效果"
    action: wait
    assert:
      - type: element_visible
        selector:
          role: "text"

  - name: "输入搜索字符"
    action: element_set_value
    ref: custom_command_search_box
    value: "ls"
    wait: 0.3

  - name: "按Enter键确认搜索（有结果显示）"
    action: keyboard_press
    key: "Return"
    wait: 0.3

  - name: "按Tab键切换到搜索结果列表（自定义命令有Focus）"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "验证自定义命令列表可见"
    action: wait
    assert:
      - type: element_visible
        selector:
          role: "list"

  - name: "按右方向键（编辑按钮有边框效果）"
    action: keyboard_press
    key: "Right"
    wait: 0.3

  - name: "按左方向键（自定义命令边框有Focus效果）"
    action: keyboard_press
    key: "Left"
    wait: 0.3

  - name: "按下箭头键切换自定义命令"
    action: keyboard_press
    key: "Down"
    wait: 0.3

  - name: "按上箭头键切换"
    action: keyboard_press
    key: "Up"
    wait: 0.3

  - name: "按Enter执行选中的自定义命令"
    action: keyboard_press
    key: "Return"
    wait: 1.0

  - name: "按ESC焦点回到终端"
    action: keyboard_press
    key: "Escape"
    wait: 0.5

teardown:
  - action: session_stop
