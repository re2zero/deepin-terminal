# Test case 109: [015]查找
# Module: 右键菜单工作区(#116125)
# Priority: 1

name: "[015]查找"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 右键菜单选择搜索(查找)"
    action: context_menu_comb
    ref: context_search
  - action: wait
    duration: 0.3

  - name: "步骤1: 验证搜索框显示"
    action: wait
    assert:
      - type: element_visible
        ref: search_input

  - name: "步骤1: 截图-查找框显示"
    action: screenshot
    desc: "窗口右上方显示查找框"

  - name: "步骤2: 在搜索框中输入内容"
    action: element_action
    ref: search_input
    do: "click"
  - action: wait
    duration: 0.3
  - action: keyboard_type_text
    text: "test"
  - action: wait
    duration: 0.3

  - name: "步骤2: 按Enter键搜索"
    action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.3

  - name: "步骤2: 截图-搜索结果显示"
    action: screenshot
    desc: "匹配内容高亮，搜索不到内容输入框爆红"

  - name: "步骤2: 清空搜索框"
    action: element_action
    ref: search_clear_button
    do: "click"
  - action: wait
    duration: 0.3

  - name: "步骤2: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
