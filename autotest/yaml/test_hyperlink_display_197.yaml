# YAML test case for terminal - 超链接显示以及跳转 (id=197)
# Module: 超链接(#116163)
# Priority: 2
name: "超链接显示以及跳转"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 输入带超链接的命令"
    action: keyboard_type_text
    text: "ping www.baidu.com"
  - action: wait
    duration: 0.5
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 2.0

  - name: "步骤1: 按Ctrl+C停止ping"
    action: keyboard_hot_key
    keys: "ctrl,c"
  - action: wait
    duration: 1.0
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤2: 输入单独网址验证超链接识别"
    action: keyboard_type_text
    text: "www.baidu.com"
  - action: wait
    duration: 0.5
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 1.0
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤3: 验证终端正常运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
