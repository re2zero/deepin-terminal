# Test case 112: 本地编码
# Module: 右键菜单工作区(#116125)
# Priority: 2

name: "本地编码"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 右键菜单打开编码列表"
    action: context_menu_comb
    ref: context_encoding
  - action: wait
    duration: 0.3

  - name: "步骤1: 验证编码列表显示"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤1: 截图-编码选择列表显示"
    action: screenshot
    desc: "终端右边窗口弹出编码选择列表"

  - name: "步骤1: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤2: 关闭编码列表-点击终端内容区域"
    action: element_action
    ref: terminal_content
    do: "click"
  - action: wait
    duration: 0.3

  - name: "步骤2: 截图-编码列表隐藏"
    action: screenshot
    desc: "自动隐藏编码列表"

  - name: "步骤2: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
