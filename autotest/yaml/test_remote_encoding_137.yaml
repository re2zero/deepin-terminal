# Test case 137: 编码
# Module: 远程管理器(#116129)
# Priority: 2

name: "远程管理-编码"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 打开远程管理插件，添加服务器"
    action: main_menu_comb
    ref: menu_remote_management
  - action: wait
    duration: 1.0

  - name: "Tab键切换到添加服务器按钮，按Enter"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.5

  - name: "Tab切换到编码选项（高级选项区域）"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3

  - name: "步骤1: 按Space键打开编码下拉菜单"
    action: keyboard_press
    key: "Space"
  - action: wait
    duration: 0.5

  - name: "步骤2: 按↓方向键切换选择编码"
    action: keyboard_press
    key: "Down"
  - action: wait
    duration: 0.3

  - name: "步骤2: 按↑方向键切换选择编码"
    action: keyboard_press
    key: "Up"
  - action: wait
    duration: 0.3

  - name: "步骤2: 按Enter键选中编码，列表收起"
    action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.5

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
