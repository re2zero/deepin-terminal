# Test case 144: 终端标签名称
# Module: 远程管理器(#116129)
# Priority: 2

name: "远程管理-终端标签名称"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 打开远程管理插件"
    action: main_menu_comb
    ref: menu_remote_management
  - action: wait
    duration: 1.0

  - name: "Tab到服务器列表，选中服务器连接"
    action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Tab"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Down"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.5

  - name: "步骤1: 查看终端标签显示连接服务器名称"
    action: wait
    duration: 1.0

  - name: "步骤2: 输入exit退出服务器连接"
    action: keyboard_type_text
    text: "exit"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 1.0

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
