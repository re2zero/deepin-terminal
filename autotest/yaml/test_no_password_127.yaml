# Test case 127: 未填写密码
# Module: 远程管理器(#116129)
# Priority: 2
# Steps:
#   1. 在添加服务器的过程中没有填写服务器密码，然后连接服务器
#   2. 服务器连接成功后，输入正确的密码，查看登陆显示
# Expected:
#   1. 服务器连接成功，但需要输入密码才能登陆
#   2. 登陆成功，可以在服务器上进行相关操作

name: "未填写密码"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 验证主窗口可见"
    action: element_action
    ref: main_frame
    do: "click"
    assert:
      - type: element_visible
        selector:
          role: "frame"

  - name: "步骤1: 主菜单打开远程管理"
    action: main_menu_comb
    ref: menu_remote_management
    wait: 1.0

  - name: "步骤1: 点击添加服务器按钮"
    action: element_action
    ref: add_server_button
    do: "click"
    wait: 0.5

  - name: "步骤1: 填写服务器名"
    action: element_action
    ref: remote_server_name
    do: "click"
    wait: 0.3
  - action: keyboard_type
    text: "test-server-no-pwd"
    wait: 0.3

  - name: "步骤1: 填写地址"
    action: element_action
    ref: remote_server_address
    do: "click"
    wait: 0.3
  - action: keyboard_type
    text: "127.0.0.1"
    wait: 0.3

  - name: "步骤1: 填写用户名"
    action: element_action
    ref: remote_username
    do: "click"
    wait: 0.3
  - action: keyboard_type
    text: "testuser"
    wait: 0.3

  - name: "步骤1: 跳过密码字段，直接点击添加"
    action: element_action
    ref: remote_add
    do: "click"
    wait: 1.0

  - name: "步骤2: 连接添加的服务器（需要输入密码）"
    action: keyboard_press
    key: "Return"
    wait: 0.5

  - name: "步骤2: 验证密码输入后登陆成功"
    action: keyboard_type
    text: "testpassword"
    wait: 0.3
  - action: keyboard_press
    key: "Return"
    wait: 1.0

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
