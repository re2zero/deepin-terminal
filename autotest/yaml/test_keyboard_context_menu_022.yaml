# Test case 022: 键盘交互焦点在终端，按"→"方向键或Alt+M快捷键
# Module: 键盘交互(#116109)
# Priority: 2

name: "键盘交互-右键菜单快捷键"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 焦点在终端，按Menu键调出右键菜单"
    action: context_menu_comb
    ref: terminal_center

  - name: "步骤2: 按↑↓方向键切换菜单项"
    action: keyboard_press
    key: "Down"

  - name: "步骤3: 按Tab键继续切换菜单"
    action: keyboard_press
    key: "Tab"

  - name: "步骤4: 验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
