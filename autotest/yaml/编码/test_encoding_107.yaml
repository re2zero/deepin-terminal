name: 编码方式
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 右键菜单-编码
    2. 鼠标任选某编码
    3. 编码列表下拉
    4. 鼠标点击终端非编码列表
    5. 鼠标双击终端
  预期结果:
    1. 列出所有可用的编码格式，默认为utf8 格式
    2. 选中后终端输出变为乱码/正常
    3. 下拉列表可以查看所有的可选编码
    4. 编码列表隐藏
    5. 编码列表仍隐藏
module: 右键菜单工作区
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1653205'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 右键菜单点击编码项'
  action: context_menu_comb
  ref: context_encoding
- action: wait
  duration: 0.3
- name: '步骤1: 验证编码列表显示'
  action: wait
  value: '1000'
- name: '步骤1: 截图-编码列表显示'
  action: noop
- name: '步骤1: 验证终端进程运行中'
  action: wait
  value: '1000'
- name: '步骤2: 鼠标滚动查看编码列表'
  action: mouse_scroll
  amount: -3
- action: wait
  duration: 0.3
- action: mouse_scroll
  amount: 3
- action: wait
  duration: 0.3
- name: '步骤2: 截图-编码列表滚动后'
  action: noop
- name: '步骤4: 点击终端内容区域使编码列表隐藏'
  action: element_action
  ref: terminal_content
  do: click
- action: wait
  duration: 0.3
- name: '步骤4: 截图-点击终端后编码列表隐藏'
  action: noop
- name: '步骤4: 验证终端进程运行中'
  action: wait
  value: '1000'
teardown:
- action: session_stop
