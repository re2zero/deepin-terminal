# YAML test case — 键盘交互远程管理列表有一个服务器 (id=051)
# 验证远程管理插件有一个服务器时的键盘交互（焦点切换）
name: "键盘交互远程管理列表有一个服务器（分组或未分组）"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "打开远程管理插件"
    action: main_menu_comb
    ref: main_menu_button
    menu:
      - "远程管理"
    assert:
      - type: element_visible
        selector:
          role: "list"

  - name: "验证远程管理列表可见"
    action: wait
    assert:
      - type: element_visible
        selector:
          role: "list"

  - name: "按Tab键焦点进入服务器选项（列表有Focus效果）"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "验证添加服务器按钮可见（高亮）"
    action: wait
    assert:
      - type: element_visible
        selector:
          role: "button"

  - name: "再按Tab切换焦点到添加服务器按钮"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "再按Tab键（添加服务器按钮高亮）"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "按Shift+Tab反向切换焦点"
    action: keyboard_hot_key
    keys: "Shift,Tab"
    wait: 0.3

  - name: "按ESC返回终端"
    action: keyboard_press
    key: "Escape"
    wait: 0.5

  - name: "验证终端进程仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
