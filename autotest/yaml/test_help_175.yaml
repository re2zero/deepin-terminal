# Test case 175: 帮助
# Module: /V25_2500（测试部专用）/B类解耦商店应用/终端/104X/主界面右上角菜单栏(#116141)
# Priority: 2

name: "帮助"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:

  - name: "步骤2: 通过主菜单打开帮助"
    action: main_menu_comb
    ref: menu_help
    wait: 2.0

  - name: "步骤3: 截图-帮助界面弹出"
    action: screenshot
    desc: "帮助界面弹出"

  - name: "步骤4: 关闭帮助窗口"
    action: keyboard_press
    key: "Escape"
    wait: 0.3

  - name: "步骤5: 按F1键再次打开帮助"
    action: keyboard_press
    key: "F1"
    wait: 2.0

  - name: "步骤6: 截图-F1键打开帮助"
    action: screenshot
    desc: "F1快捷键弹出帮助信息界面"

  - name: "步骤7: 浏览帮助内容-按Down键"
    action: keyboard_press
    key: "Down"
    wait: 0.3

  - name: "步骤8: 浏览帮助内容-再次按Down键"
    action: keyboard_press
    key: "Down"
    wait: 0.3

  - name: "步骤9: 截图-帮助内容"
    action: screenshot
    desc: "帮助内容浏览正常，文案插图显示正确"

  - name: "步骤10: 关闭帮助窗口"
    action: keyboard_press
    key: "Escape"
    wait: 0.3

  - name: "步骤11: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
