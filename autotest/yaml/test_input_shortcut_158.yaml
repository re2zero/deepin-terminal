# Test case 158: 键入快捷键
# Module: 自定义命令(#116137)
# Priority: 2

name: "键入快捷键"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 主菜单打开自定义命令"
    action: main_menu_comb
    ref: menu_custom_commands
  - action: wait
    duration: 0.3

  - name: "步骤1: 截图-自定义命令列表界面"
    action: screenshot
    desc: "弹出添加自定义窗口"

  - name: "步骤3: 点击快捷键输入栏"
    action: element_action
    ref: custom_command_shortcut_input
    do: "click"
  - action: wait
    duration: 0.3

  - name: "步骤3: 敲单个字母测试"
    action: keyboard_press
    key: "a"
  - action: wait
    duration: 0.3

  - name: "步骤3: 截图-单个字母不能正常敲入"
    action: screenshot
    desc: "单个字母不能正常敲入"

  - name: "步骤4: 敲入Ctrl+Shift+字母组合键"
    action: keyboard_hot_key
    keys: "ctrl+shift+a"
  - action: wait
    duration: 0.3

  - name: "步骤4: 截图-快捷键Ctrl+Shift+A输入"
    action: screenshot
    desc: "Ctrl+Shift+字母可以正常敲入且显示正常"

  - name: "步骤5: 清除后再敲入Ctrl+Shift+Alt+字母"
    action: keyboard_press
    key: "BackSpace"
    wait: 0.1
  - action: keyboard_press
    key: "BackSpace"
    wait: 0.1
  - action: keyboard_hot_key
    keys: "ctrl+shift+alt+b"
  - action: wait
    duration: 0.3

  - name: "步骤5: 截图-多个修饰键组合快捷键"
    action: screenshot
    desc: "Ctrl+Shift+Alt组合键可以正常敲入且显示正常"

  - name: "按Escape退出自定义命令"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "验证终端仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
