# Test case 171: windowmod
# Module: /V25_2500（测试部专用）/B类解耦商店应用/终端/104X(#116091)
# Priority: 2

name: "windowmod"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 验证主窗口可见"
    action: element_action
    ref: main_frame
    do: "click"
    assert:
      - type: element_visible
        selector:
          role: "frame"

  - name: "步骤2: 输入deepin-terminal --help"
    action: keyboard_type
    text: "deepin-terminal --help"
    wait: 0.3

  - name: "步骤3: 回车执行"
    action: keyboard_press
    key: "Return"
    wait: 1.0

  - name: "步骤4: 截图-帮助信息输出"
    action: screenshot
    desc: "帮助信息包含-m/--window-mode参数及选项"

  - name: "步骤5: 输入deepin-terminal -m normal"
    action: keyboard_type
    text: "deepin-terminal -m normal"
    wait: 0.3

  - name: "步骤6: 回车执行"
    action: keyboard_press
    key: "Return"
    wait: 2.0

  - name: "步骤7: 截图-normal窗口"
    action: screenshot
    desc: "新终端以正常窗口模式打开"

  - name: "步骤8: 关闭新窗口"
    action: keyboard_hot_key
    keys: "Alt,F4"
    wait: 1.0

  - name: "步骤9: 输入deepin-terminal -m fullscreen"
    action: keyboard_type
    text: "deepin-terminal -m fullscreen"
    wait: 0.3

  - name: "步骤10: 回车执行"
    action: keyboard_press
    key: "Return"
    wait: 2.0

  - name: "步骤11: 截图-全屏窗口"
    action: screenshot
    desc: "新终端以全屏模式打开"

  - name: "步骤12: 退出全屏"
    action: keyboard_hot_key
    keys: "Alt,F4"
    wait: 1.0

  - name: "步骤13: 输入deepin-terminal -m maximum"
    action: keyboard_type
    text: "deepin-terminal -m maximum"
    wait: 0.3

  - name: "步骤14: 回车执行"
    action: keyboard_press
    key: "Return"
    wait: 2.0

  - name: "步骤15: 截图-最大化窗口"
    action: screenshot
    desc: "新终端以最大化模式打开"

  - name: "步骤16: 关闭新窗口"
    action: keyboard_hot_key
    keys: "Alt,F4"
    wait: 1.0

  - name: "步骤17: 输入deepin-terminal -m splitscreen"
    action: keyboard_type
    text: "deepin-terminal -m splitscreen"
    wait: 0.3

  - name: "步骤18: 回车执行"
    action: keyboard_press
    key: "Return"
    wait: 2.0

  - name: "步骤19: 截图-分屏窗口"
    action: screenshot
    desc: "新终端以分屏模式打开"

  - name: "步骤20: 关闭新窗口"
    action: keyboard_hot_key
    keys: "Alt,F4"
    wait: 1.0

  - name: "步骤21: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
