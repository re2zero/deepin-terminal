# YAML test case for terminal - 关闭标签页 (id=115)
# Module: 右键菜单标签页(#116127)
# Priority: 1
name: "关闭标签页"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 新建多个工作区"
    action: element_action
    ref: add_tab_button
    do: "click"
  - action: wait
    duration: 0.3
  - action: element_action
    ref: add_tab_button
    do: "click"
  - action: wait
    duration: 0.3
  - action: element_action
    ref: add_tab_button
    do: "click"
  - action: wait
    duration: 0.3
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤2: 右键标签页打开菜单，选择关闭标签页"
    action: element_action
    ref: tab_list
    do: "right_click"
  - action: wait
    duration: 0.3
  - name: "按Return键选择关闭标签页（第一项）"
    action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.3
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
