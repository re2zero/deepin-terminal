# Test case 108: 远程管理
# Module: 右键菜单工作区(#116125)
# Priority: 1

name: "远程管理"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 右键菜单选择远程管理"
    action: context_menu_comb
    ref: context_remote_management
  - action: wait
    duration: 0.3

  - name: "步骤1: 截图-远程管理面板显示"
    action: screenshot
    desc: "右侧显示出远程管理添加页面"

  - name: "步骤1: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤2: 点击终端内容区域使远程管理页面隐藏"
    action: element_action
    ref: terminal_content
    do: "click"
  - action: wait
    duration: 0.3

  - name: "步骤2: 截图-点击后远程管理页面隐藏"
    action: screenshot
    desc: "远程管理页面隐藏"

  - name: "步骤2: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
