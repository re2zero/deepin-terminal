# Test case 098: 关闭工作区快捷键
# Module: 设置界面快捷键(#116121)
# Priority: 3

name: "关闭工作区快捷键"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 新建一个工作区"
    action: element_action
    ref: add_tab_button
    do: "click"
  - action: wait
    duration: 0.3

  - name: "步骤2: 打开设置界面"
    action: main_menu_comb
    ref: menu_settings

  - name: "步骤3: 点击快捷键导航"
    action: element_action
    ref: settings_shortcuts
    do: "click"
  - action: wait
    duration: 0.3

  - name: "步骤4: 点击其他子类别"
    action: element_action
    ref: settings_other_shortcuts
    do: "click"
  - action: wait
    duration: 0.3

  - name: "步骤5: Tab切换到关闭工作区快捷键项"
    action: keyboard_press
    key: "Tab"
  - action: keyboard_press
    key: "Tab"
  - action: keyboard_press
    key: "Tab"
  - action: keyboard_press
    key: "Tab"
  - action: keyboard_press
    key: "Tab"

  - name: "步骤6: Enter进入编辑模式，修改快捷键为Ctrl+W"
    action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.3
  - action: keyboard_hot_key
    keys: "ctrl+w"
  - action: wait
    duration: 0.3

  - name: "步骤7: 使用旧快捷键验证不生效"
    action: keyboard_hot_key
    keys: "alt+q"
  - action: wait
    duration: 0.3

  - name: "步骤8: 验证设置对话框可见"
    action: wait
    assert:
      - type: element_visible
        selector:
          role: "dialog"

  - name: "步骤9: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
