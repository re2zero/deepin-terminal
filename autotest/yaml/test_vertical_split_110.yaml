# Test case 110: 纵向分屏
# Module: 右键菜单工作区(#116125)
# Priority: 2

name: "纵向分屏"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 右键菜单选择纵向分屏"
    action: context_menu_comb
    ref: context_vertical_split
  - action: wait
    duration: 1.0

  - name: "步骤1: 截图-纵向分屏显示"
    action: screenshot
    desc: "窗口被分为2个，左右分屏"

  - name: "步骤1: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤2: 关闭当前分屏窗口恢复单屏"
    action: context_menu_comb
    ref: context_close_workspace
  - action: wait
    duration: 1.0

  - name: "步骤2: 截图-恢复单屏后"
    action: screenshot
    desc: "关闭分屏窗口恢复单屏"

  - name: "步骤3: 使用快捷键Ctrl+Shift+J纵向分屏"
    action: keyboard_hot_key
    keys: "ctrl+shift+j"
  - action: wait
    duration: 1.0

  - name: "步骤3: 截图-快捷键纵向分屏"
    action: screenshot
    desc: "快捷键Ctrl+Shift+J纵向分屏显示"

  - name: "步骤3: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
