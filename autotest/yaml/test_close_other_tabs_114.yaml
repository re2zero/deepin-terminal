# YAML test case for terminal - 关闭其它标签页 (id=114)
# Module: 右键菜单标签页(#116127)
# Priority: 1
name: "关闭其它标签页"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 新建多个工作区"
    action: element_action
    ref: add_tab_button
    do: "click"
  - action: wait
    duration: 0.3
  - action: element_action
    ref: add_tab_button
    do: "click"
  - action: wait
    duration: 0.3
  - action: element_action
    ref: add_tab_button
    do: "click"
  - action: wait
    duration: 0.3
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤2: 右键标签页打开菜单，选择关闭其它标签页"
    action: element_action
    ref: tab_list
    do: "right_click"
  - action: wait
    duration: 0.3
  - name: "按Down键导航到关闭其它标签页"
    action: keyboard_press
    key: "Down"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Down"
  - action: wait
    duration: 0.3
  - action: keyboard_press
    key: "Return"
  - action: wait
    duration: 0.3
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤3: 只有一个标签页时，右键打开菜单"
    action: element_action
    ref: tab_list
    do: "right_click"
  - action: wait
    duration: 0.3
    assert:
      - type: process_running
        app: "terminal"

  - name: "按ESC关闭菜单"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
