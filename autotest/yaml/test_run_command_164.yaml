name: "运行"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 通过主菜单打开自定义命令面板并添加命令"
    action: main_menu_comb
    ref: menu_custom_commands
    wait: 1.0

  - name: "步骤1: 新建自定义命令 深度音乐 deepin-music 快捷键Ctrl+Shift+M"
    action: element_set_value
    ref: custom_command_name_input
    value: "深度音乐"
  - action: element_set_value
    ref: custom_command_command_input
    value: "echo deepin-music-test"
  - action: element_set_value
    ref: custom_command_shortcut_input
    value: "Ctrl+Shift+M"
  - action: element_action
    ref: custom_command_add
    do: "click"
  - action: wait
    duration: 1.0

  - name: "步骤1: 验证成功添加到自定义命令列表"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤2: 终端中键盘敲入Ctrl+Shift+M运行自定义命令"
    action: keyboard_hot_key
    keys: "ctrl+shift+m"
  - action: wait
    duration: 1.0

  - name: "步骤2: 验证终端仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤3: 在自定义命令列表中点击名为深度音乐的命令"
    action: element_action
    ref: custom_command_list
    do: "click"
  - action: wait
    duration: 0.5

  - name: "步骤3: 验证终端仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤4: 修改命令为无效命令sayonara，修改名称为测试，保存"
    action: element_set_value
    ref: custom_command_name_input
    value: "测试"
  - action: element_set_value
    ref: custom_command_command_input
    value: "sayonara"
  - action: element_action
    ref: custom_command_save
    do: "click"
  - action: wait
    duration: 1.0

  - name: "步骤4: 验证修改成功（终端仍在运行）"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤5: 再次按快捷键Ctrl+Shift+M，运行无效命令"
    action: keyboard_hot_key
    keys: "ctrl+shift+m"
  - action: wait
    duration: 1.0

  - name: "步骤5: 验证终端仍在运行（无效命令不会导致崩溃）"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
