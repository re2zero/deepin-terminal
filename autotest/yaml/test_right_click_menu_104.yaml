# Test case 104: 右键菜单显示项
# Module: 右键菜单工作区(#116125)
# Priority: 2

name: "右键菜单显示项"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 1.0

steps:
  - name: "步骤1: 右键打开通用菜单"
    action: context_menu_comb
    ref: context_paste
  - action: wait
    duration: 0.3

  - name: "步骤1: 截图-右键通用菜单"
    action: screenshot
    desc: "右键菜单显示在文件管理器中打开、横向分屏、纵向分屏、关闭工作区等"

  - name: "步骤1: 按ESC关闭右键菜单"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "步骤1: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

  - name: "步骤2: 未选中内容且非超链接时右键"
    action: context_menu_comb
    ref: context_open_in_file_manager
  - action: wait
    duration: 0.3

  - name: "步骤2: 截图-无选中内容右键菜单"
    action: screenshot
    desc: "右键菜单显示通用菜单项"

  - name: "步骤2: 按ESC关闭菜单"
    action: keyboard_press
    key: "Escape"
  - action: wait
    duration: 0.3

  - name: "步骤3: 验证终端仍在运行"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
