# Test case 172: 优先级
# Module: /V25_2500（测试部专用）/B类解耦商店应用/终端/104X(#116091)
# Priority: 2

name: "优先级"
app: "deepin-terminal"
screenshot: false

setup:
  - action: session_start
    command: "deepin-terminal"
    wait: 3.0

steps:
  - name: "步骤1: 验证主窗口可见"
    action: element_action
    ref: main_frame
    do: "click"
    assert:
      - type: element_visible
        selector:
          role: "frame"

  - name: "步骤2: 通过主菜单打开设置"
    action: main_menu_comb
    ref: menu_settings
    wait: 1.0
    assert:
      - type: element_visible
        ref: settings_dialog

  - name: "步骤3: 点击窗口设置导航项"
    action: element_action
    ref: settings_window
    do: "click"
    wait: 0.5

  - name: "步骤4: Tab键定位启动窗口模式下拉框"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "步骤5: 再次Tab键定位目标"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "步骤6: Space键展开下拉框"
    action: keyboard_press
    key: "Space"
    wait: 0.3

  - name: "步骤7: Down键选择全屏模式"
    action: keyboard_press
    key: "Down"
    wait: 0.3

  - name: "步骤8: Enter键确认选择全屏模式"
    action: keyboard_press
    key: "Enter"
    wait: 0.5

  - name: "步骤9: Tab键将焦点移到关闭按钮"
    action: keyboard_press
    key: "Tab"
    wait: 0.3

  - name: "步骤10: Enter键关闭设置窗口"
    action: keyboard_press
    key: "Enter"
    wait: 0.5

  - name: "步骤11: Ctrl+Shift+T新建标签验证全屏模式生效"
    action: keyboard_hot_key
    keys: "ctrl+shift+t"
    wait: 2.0

  - name: "步骤12: 截图-新建窗口为全屏模式"
    action: screenshot
    desc: "设置窗口启动模式为全屏后，新建窗口为全屏模式"

  - name: "步骤13: 在终端输入deepin-terminal -m normal"
    action: keyboard_type
    text: "deepin-terminal -m normal"
    wait: 0.3

  - name: "步骤14: 回车执行"
    action: keyboard_press
    key: "Return"
    wait: 2.0

  - name: "步骤15: 截图-命令行参数优先级更高"
    action: screenshot
    desc: "-m normal参数优先级高于设置，弹出正常窗口"

  - name: "步骤16: 关闭新窗口"
    action: keyboard_hot_key
    keys: "Alt,F4"
    wait: 1.0

  - name: "步骤17: 验证终端进程运行中"
    action: wait
    assert:
      - type: process_running
        app: "terminal"

teardown:
  - action: session_stop
