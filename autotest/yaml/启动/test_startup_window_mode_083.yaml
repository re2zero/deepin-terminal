name: 启动时使用窗口模式下拉框
app: deepin-terminal
screenshot: false
description: |
  测试步骤:
    1. 打开启动器，在启动器中点击终端图标，查看软件显示
    2. 打开启动器，在启动器中选中终端图标，点击右键－打开，查看软件显示
  预期结果:
    1. 终端正常启动
    2. 终端正常启动
module: 启动终端
feature: ''
tags:
- L2
vars:
  XLSX_ID: '1652943'
setup:
- action: session_start
  command: deepin-terminal
  wait: 1.0
steps:
- name: '步骤1: 通过主菜单打开设置'
  action: main_menu_comb
  ref: menu_settings
  wait: 0.3
- name: '步骤2: 点击窗口设置导航项'
  action: element_action
  ref: settings_window
  do: click
  wait: 0.3
- name: '步骤3: Tab键将焦点移到启动时使用下拉框（默认正常窗口）'
  action: keyboard_press
  key: Tab
  wait: 0.3
- name: '步骤4: Enter键展开下拉列表'
  action: keyboard_press
  key: Enter
  wait: 0.3
- name: '步骤5: 按向下箭头选择分屏模式'
  action: keyboard_press
  key: Down
  wait: 0.3
- name: '步骤6: 再次按向下箭头选择全屏模式'
  action: keyboard_press
  key: Down
  wait: 0.3
- name: '步骤7: 再次按向下箭头选择最大化模式'
  action: keyboard_press
  key: Down
  wait: 0.3
- name: '步骤8: 按Enter键确认选择最大化'
  action: keyboard_press
  key: Enter
  wait: 0.3
- name: '步骤9: 按向上箭头反向选择回全屏'
  action: keyboard_press
  key: Enter
  wait: 0.3
- name: '步骤10: 按向上箭头选择'
  action: keyboard_press
  key: Up
  wait: 0.3
- name: '步骤11: 再次按向上箭头回退到分屏'
  action: keyboard_press
  key: Up
  wait: 0.3
- name: '步骤12: 按向上箭头回退到正常窗口（默认）'
  action: keyboard_press
  key: Up
  wait: 0.3
- name: '步骤13: Enter确认选择正常窗口'
  action: keyboard_press
  key: Enter
  wait: 0.3
- name: '步骤14: ESC关闭设置窗口'
  action: keyboard_press
  key: Escape
  wait: 0.3
- name: 验证终端进程运行中
  action: wait
  value: '1000'
teardown:
- action: session_stop
