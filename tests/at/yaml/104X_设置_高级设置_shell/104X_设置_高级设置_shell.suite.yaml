name: 104X_设置_高级设置_shell_suite
app: deepin-terminal
module: 104X_设置_高级设置_shell
setup:
- action: session_start
  command: deepin-terminal
  wait: 3.0
suites:
- id: suite_104X_设置_高级设置_shell_001_s1
  name: 默认shell下拉列表显示
  description: ''
  steps:
  - step_type: action
    action: dtk_main_menu
    selector:
      name: TermWidgetPage
    items:
    - 设置
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: SettingDialog
- id: suite_104X_设置_高级设置_shell_002_s1
  name: 切换下拉列表shell程序
  description: ''
  steps:
  - step_type: action
    action: dtk_main_menu
    selector:
      name: TermWidgetPage
    items:
    - 设置
  - step_type: action
    action: keyboard_press
    key: Tab
  - step_type: action
    action: keyboard_press
    key: Enter
  - step_type: action
    action: keyboard_press
    key: Down
  - step_type: action
    action: keyboard_press
    key: Enter
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+Shift+T
  - step_type: action
    action: dtk_main_menu
    selector:
      name: TermWidgetPage
    items:
    - 新建窗口
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TermWidgetPage
    items:
    - 横向分屏
  - step_type: action
    action: dtk_context_menu
    selector:
      name: TermWidgetPage
    items:
    - 纵向分屏
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: SettingDialog
  - step_type: assert
    action: assert_element
    selector:
      name: MainWindowTermQStackedWidget
- id: suite_104X_设置_高级设置_shell_003_s1
  name: 切换shell后终端中基本功能操作
  description: ''
  steps:
  - step_type: action
    action: dtk_main_menu
    selector:
      name: TermWidgetPage
    items:
    - 设置
  - step_type: action
    action: keyboard_press
    key: Tab
  - step_type: action
    action: keyboard_press
    key: Enter
  - step_type: action
    action: keyboard_press
    key: Down
  - step_type: action
    action: keyboard_press
    key: Enter
  - step_type: action
    action: keyboard_hot_key
    key: Ctrl+Shift+T
  - step_type: action
    action: dtk_main_menu
    selector:
      name: TermWidgetPage
    items:
    - 新建窗口
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: SettingDialog
  - step_type: assert
    action: assert_element
    selector:
      name: MainWindowTermQStackedWidget
teardown:
- action: session_stop
