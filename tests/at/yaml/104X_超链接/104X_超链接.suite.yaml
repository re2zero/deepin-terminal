name: 104X_超链接_suite
app: deepin-terminal
module: 104X_超链接
setup:
- action: session_start
  command: deepin-terminal
  wait: 3.0
suites:
- id: suite_104X_超链接_001_s1
  name: 终端输入网址识别超链接并点击
  description: ''
  steps:
  - step_type: action
    action: keyboard_type
    text: www.baidu.com
  - step_type: action
    action: keyboard_press
    key: Return
  - step_type: action
    action: keyboard_hot_key
    key: ctrl
  - step_type: action
    action: mouse_click
    x: 200
    y: 180
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      accessible_id: MainWindowCentralQWidget
teardown:
- action: session_stop
