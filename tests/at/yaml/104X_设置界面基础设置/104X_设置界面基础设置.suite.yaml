  name: 设置界面显示
  description: ''
  steps:
  - step_type: action
    action: dtk_main_menu
    selector:
      name: TermWidgetPage
    items:
    - 设置
  - step_type: action
    action: keyboard_press
    key: Tab
  - step_type: action
    action: keyboard_press
    key: Down
  - step_type: action
    action: keyboard_press
    key: Enter
  - step_type: action
    action: keyboard_press
    key: Down
  - step_type: action
    action: keyboard_press
    key: Down
  - step_type: action
    action: keyboard_press
    key: Enter
  - step_type: action
    action: mouse_scroll
    value: -3
  assert_steps:
  - step_type: assert
    action: assert_element
    selector:
      name: SettingDialog
  - step_type: assert
    action: assert_element
    selector:
      name: SettingDialog
  - step_type: assert
    action: assert_element
    selector:
      name: SettingDialog
  - step_type: assert
