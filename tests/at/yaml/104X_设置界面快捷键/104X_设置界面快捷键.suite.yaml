name: 104X_设置界面快捷键_suite
app: deepin-terminal
module: 104X_设置界面快捷键
setup:
- action: session_start
  command: deepin-terminal
  wait: 3.0
suites:
- id: suite_104X_设置界面快捷键_001_s1
  name: 终端快捷键-粘贴与全选修改
  description: ''
  steps:
  - step_type: action
    action: keyboard_type
    text: test_paste_123
  - step_type: action
    action: dtk_main_menu
    selector:
      name: TermWidgetPage
    items:
    - 设置
  - step_type: action
    action: keyboard_press
    key: Shift
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+shift+v
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+e
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+e
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+shift+v
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+shift+a
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+a
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+a
  - step_type: action
    action: keyboard_hot_key
    key: ctrl+shift+a
  assert_steps:
  - step_type: assert
    action: assert_file_exists
    path: ~/.config/deepin/deepin-terminal/config.conf
  - step_type: assert
    action: assert_element
    selector:
      name: SettingDialog
